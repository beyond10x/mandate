[package]
name = "mandate-conformance"
description = "The in-process ESS conformance target over the real Mandate handlers, and the runner that drives it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "mandate-conform"
path = "src/main.rs"

[dependencies]
mandate-types = { version = "0.2.0", path = "../mandate-types" }
mandate-model = { version = "0.2.0", path = "../mandate-model" }
mandate-federation = { version = "0.2.0", path = "../mandate-federation" }
mandate-identity = { version = "0.2.0", path = "../mandate-identity" }
mandate-authz = { version = "0.2.0", path = "../mandate-authz" }
mandate-graph = { version = "0.2.0", path = "../mandate-graph" }
mandate-policy = { version = "0.2.0", path = "../mandate-policy" }
serde = { workspace = true }
serde_json = { workspace = true }
ess-conformance = { workspace = true }
ess-primitives = { workspace = true }
ess-domain = { workspace = true }
clap = { workspace = true }
