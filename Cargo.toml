[workspace]
resolver = "3"
members = ["crates/*", "services/*", "bins/mandate", "xtask"]
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
publish = false
repository = "https://github.com/beyond10x/mandate"
[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
all = "deny"
[profile.dev]
debug = 0
incremental = false
[profile.test]
debug = 0
incremental = false
