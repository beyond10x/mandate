[workspace]
resolver = "3"
members = ["crates/*", "services/*", "bins/mandate", "xtask"]
[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
publish = false
repository = "https://github.com/beyond10x/mandate"
[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
jsonschema = { version = "=0.52.1", default-features = false }
jsonwebtoken = { version = "=10.4.0", default-features = false, features = ["aws_lc_rs"] }
rand = "=0.8.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
httparse = "=1.10.1"
aws-lc-rs = "=1.18.1"
ureq = { version = "=3.4.2", default-features = false, features = ["native-tls"] }
eventlog-core = { version = "0.2.1", git = "https://github.com/beyond10x/eventlog.git", tag = "0.2.1" }
eventlog-sqlite = { version = "0.2.1", git = "https://github.com/beyond10x/eventlog.git", tag = "0.2.1" }
ess-conformance = { version = "0.26.0", git = "https://github.com/beyond10x/ess.git", tag = "0.26.0" }
ess-primitives = { version = "0.26.0", git = "https://github.com/beyond10x/ess.git", tag = "0.26.0" }
ess-domain = { version = "0.26.0", git = "https://github.com/beyond10x/ess.git", tag = "0.26.0" }
[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
all = "deny"
[profile.dev]
debug = 0
incremental = false
[profile.test]
debug = 0
incremental = false
