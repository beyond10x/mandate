tags:
- name: audit
  description: 'Canonical redacted audit records and the trusted worker append port. UNMAPPED-AUDIT-ROUTING: per-domain event mapping, durable outbox transport, the concrete retention floor and failure policy remain required; retention itself is redaction, never deletion. Named AuditAction and AuditOutcome do not admit arbitrary values.'
paths:
  /audit/commands/RecordAuditEvent:
    post:
      operationId: mandate.audit.RecordAuditEvent
      summary: RecordAuditEvent
      tags:
      - audit
      requestBody:
        description: The input `mandate.audit.RecordAuditEvent` declares.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/mandate.audit.RecordAuditEvent.Input'
      responses:
        '202':
          description: 'Outcome `recorded`: the branch the specification declares for this input. Events this branch emits are published to consumers, not returned here.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mandate.audit.RecordAuditEvent.recorded.Response'
        '502':
          description: 'Outcome `denied`: something outside the request refused. The input was acceptable, so the caller has nothing to correct and a retry is meaningful.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mandate.audit.RecordAuditEvent.denied.Response'
  /audit/commands/RedactAuditEvent:
    post:
      operationId: mandate.audit.RedactAuditEvent
      summary: RedactAuditEvent
      tags:
      - audit
      requestBody:
        description: The input `mandate.audit.RedactAuditEvent` declares.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/mandate.audit.RedactAuditEvent.Input'
      responses:
        '202':
          description: 'Outcome `accepted`: the branch the specification declares for this input. Events this branch emits are published to consumers, not returned here.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mandate.audit.RedactAuditEvent.accepted.Response'
        '409':
          description: 'Outcome `wrong-state`: the input was acceptable and the subject is in a state this command does not act from. Resending the same request changes nothing until something else moves it.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mandate.audit.RedactAuditEvent.wrong-state.Response'
        '502':
          description: 'Outcome `denied`: something outside the request refused. The input was acceptable, so the caller has nothing to correct and a retry is meaningful.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mandate.audit.RedactAuditEvent.denied.Response'
