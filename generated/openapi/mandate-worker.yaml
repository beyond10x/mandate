      additionalProperties: false
      description: The trusted append adapter must persist one validated, redacted record before acknowledging its identifier; durable storage/outbox semantics are required under UNMAPPED-AUDIT-ROUTING. Taken when no other outcome's condition matched. A `mandate.audit.AuditEvent` now exists, in `Recorded`. Its identity is published as `id` on `mandate.audit.AuditEventRecorded`. Emits `AuditEventRecorded`, published to consumers rather than returned here.
