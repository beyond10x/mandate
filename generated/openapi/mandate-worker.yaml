    mandate.audit.RedactAuditEvent.accepted.Response:
      additionalProperties: false
      description: The only answer to a retention or erasure obligation. The record keeps its identity, its correlation and the fact that it was redacted; the redacted content does not reappear in this event. Deletion of an audit event is admitted by no command. Taken when no other outcome's condition matched. A `mandate.audit.AuditEvent` has moved to `Redacted`, along `redact`. The instance is the one `id` names. Emits `AuditEventRedacted`, published to consumers rather than returned here.
      properties:
        outcome:
          const: accepted
          description: Which declared outcome the command took.
      required:
      - outcome
      type: object
    mandate.audit.RedactAuditEvent.denied.Response:
      additionalProperties: false
      description: 'Decided outside the request: Caller lacks audit-redaction authority for the verified organization, the event is unresolved, the applicable retention floor has not passed, the request would remove the record rather than redact it, or redaction cannot rewrite the projection while retaining that the record existed and was redacted..'
