info:
  title: mandate-control-plane
  summary: Administrative deployment and documentation publisher for the shared mandate.core vocabulary. All four deployments compile those shared library types; core is not a remote control-plane runtime dependency. See docs/architecture/ownership.md.
  description: |-
    The HTTP surface of `mandate-control-plane`, one of the components of `mandate` v1.

    Every path here is one semantic command, so the method is always POST and the path is the command's wire name under its domain's: a command is not a resource, and this document does not invent one. A status code is the outcome the specification declares — 202 for a branch that was taken, 422 for a refusal the input decides, 502 for a refusal decided outside the request — and the `outcome` property of every response body names the branch. Events emitted by a branch are published to consumers through the event transport, and the `published` property of every response body lists them too, in publication order.
  version: v1
  x-ess-provenance:
    system: mandate
    specification_version: v1
    source_digest: 93e606a6a9a240d84f7a047c4f5a0ef306ec3d0249c586b34a308c37240cd93a
    contract_digest: slice-sha256/2:8a18b88a4ee4851c807fae41d45e719293272f2a32208b2eb8e0bce09b304228
tags:
- name: delegation
- name: directory
- name: federation
- name: identity
  description: 'Principal, session and independent principal/organization/federation generation ownership. UNMAPPED-EPOCH: each generation record declares one non-negative Integer generation, the recorded stand-in for the addendum''s u64; monotonic increment, denial at the maximum and per-dimension snapshot values are absent until supported. EpochSnapshotRef is an immutable record handle, not a generation number. Refresh and exchange cannot be implemented without closing this blocker.'
- name: tenancy
- name: workload
