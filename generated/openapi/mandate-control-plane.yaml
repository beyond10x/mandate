    mandate.federation.AuthenticateFederation.accepted.Response:
      additionalProperties: false
      description: 'A validated federated login mints the session, which is step 9 of the resolution order in docs/architecture/federated-login.md. FederationAuthenticated carries the whole mandate.identity.Session record — the new session identity, the principal, the resolved organization, the connection, the epoch snapshot the session is bound to and its expiry — so the identity fold materializes the session from this event alone and reads no command input or response. The audience and the correlation are carried beside the record. The principal, the organization, the epoch snapshot handle and the expiry are the ones this command resolved and returned, so the fold reads each from the response rather than from a value the implementation invented; the snapshot''s own contents are recorded by the adapter through EpochSnapshotRecorded. ExternalProfileObserved records the profile of this login for later issuance (fork F13): the external principal the login resolved through its link, and the email, its verified flag, the name and the groups, each read from the validated proof and never from a caller input. An email the upstream does not mark verified is recorded with email_verified false, never true. The groups are those the connection''s group filter admits: a group outside the allowlist never appears in the event, and a connection without a filter records an empty list. Taken when no other outcome''s condition matched. A `mandate.identity.Session` now exists, in `Active`. Its identity is published as `session_id` on `mandate.federation.FederationAuthenticated`. Emits `FederationAuthenticated` and `ExternalProfileObserved`, published to consumers and listed under `published`.'
      properties:
        outcome:
          const: accepted
          description: Which declared outcome the command took.
        published:
          description: 'Every event this branch published, in publication order: its qualified name and its payload.'
          items: false
          maxItems: 2
          minItems: 2
          prefixItems:
          - additionalProperties: false
            properties:
              event:
                const: mandate.federation.FederationAuthenticated
                type: string
              payload:
                $ref: '#/components/schemas/mandate.federation.FederationAuthenticated.Event'
            required:
            - event
            - payload
            type: object
          - additionalProperties: false
            properties:
              event:
                const: mandate.federation.ExternalProfileObserved
                type: string
              payload:
                $ref: '#/components/schemas/mandate.federation.ExternalProfileObserved.Event'
            required:
            - event
            - payload
            type: object
          type: array
      required:
      - outcome
      - published
      type: object
    mandate.federation.AuthenticateFederation.denied.Response:
      additionalProperties: false
      description: 'Decided outside the request: Connection is disabled/untrusted, proof signature/issuer/audience/expiry is invalid, tenant resolution has zero or multiple matches (a rule naming a claim matches only when the validated claim equals one of its listed values; an absent claim matches none), principal linking is absent/conflicting, the groups the connection''s filter admits number more than its cap, or any email-domain/unverified-input fallback would be required. A refused login opens no session and records no profile..'
