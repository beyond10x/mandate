            application/json:
              schema:
                additionalProperties: false
                properties:
                  committed:
                    description: '`true` when the command''s effect and events were committed and delivering what it published failed; `false` when an unmet obligation stopped the command before anything was written.'
                    type: boolean
                  refused:
                    description: What was left unfinished, in words.
                    type: string
                required:
                - refused
