    mandate.credential.ExchangeCredential.accepted.Response:
      additionalProperties: false
      description: An access-credential subject is admitted when its source registration is among the target's allowed_exchange_sources. An identity-token subject (subject_token_type IdToken) is an identity token this deployment signed, unexpired, under a key still admitted for verification; its source is the client it was issued to (its azp, else its one audience). It is admitted only to a target registered with a client, and only when that client lists the source client among its trusted_peers and the source client, the target's client and the target are of one organization (fork F20). Both forms are decided by this one admission and recorded by this one event; a trusted peer is never a second authority path, and a peer relation is never transitive. Taken when no other outcome's condition matched. A `mandate.credential.AccessCredential` now exists, in `Active`. Its identity is published as `credential_id` on `mandate.credential.TokenExchangeAllowed`. Emits `TokenExchangeAllowed`, published to consumers and listed under `published`.
      properties:
        outcome:
          const: accepted
          description: Which declared outcome the command took.
        published:
          description: 'Every event this branch published, in publication order: its qualified name and its payload.'
          items: false
          maxItems: 1
          minItems: 1
          prefixItems:
          - additionalProperties: false
            properties:
              event:
                const: mandate.credential.TokenExchangeAllowed
                type: string
              payload:
                $ref: '#/components/schemas/mandate.credential.TokenExchangeAllowed.Event'
            required:
            - event
            - payload
            type: object
          type: array
      required:
      - outcome
      - published
      type: object
    mandate.credential.ExchangeCredential.denied.Response:
      additionalProperties: false
      description: 'Decided outside the request: Either independently validated proof is invalid/revoked/expired/stale; actor, tenant, registered target/source, scope, space, delegation or ceiling binding fails; two current capability ceilings share one agent and organization-or-platform key; transitive delegation is requested; approval is required; an identity-token subject''s client is not a trusted peer of the target''s client, the target names no client, or the two clients are of different organizations; or authority/expiry narrowing and durable audit fail..'
      properties:
        error:
          const: mandate.credential.Denied
          description: Fail closed; no credential, authority or lifecycle mutation on refusal.
          type: string
        outcome:
          const: denied
          description: Which declared outcome the command took.
        payload:
          $ref: '#/components/schemas/mandate.credential.Denied.Error'
        published:
