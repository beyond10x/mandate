name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install pinned contract tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in ess:0.26.0 aep:0.55.0; do
            tool_name="${pair%%:*}"
            tool_version="${pair#*:}"
            archive="${tool_name}-${tool_version}-x86_64-unknown-linux-gnu.tar.gz"
            mkdir "$RUNNER_TEMP/$tool_name"
            gh release download "$tool_version" --repo "beyond10x/$tool_name" --pattern "$archive" --pattern SHA256SUMS --dir "$RUNNER_TEMP/$tool_name"
            (cd "$RUNNER_TEMP/$tool_name" && sha256sum --check --ignore-missing SHA256SUMS && tar -xzf "$archive")
            find "$RUNNER_TEMP/$tool_name" -type f \( -name ess -o -name aep -o -name protocol \) -exec install -m 755 {} "$HOME/.cargo/bin/" \;
          done
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Foundation gate
        run: cargo xtask check
