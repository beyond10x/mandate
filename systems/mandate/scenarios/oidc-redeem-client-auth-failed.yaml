type: ess-scenario/2
domain: mandate.credential
scenario: oidc-redeem-client-auth-failed
summary: '`a confidential client presents no secret or one matching none of its recorded verifiers`: code, PKCE and redirect match; InvalidClient, nothing drawn; corpus: none.'
# The client and its resource server are registered by their commands in the timeline, so no
# record is established that a command creates. The code is the one record seeded: its
# `client_id` and `target` are the first identities the target allocates for an OAuth client
# and a resource server, because a setup cannot name a timeline capture.
arrange:
- instance: client
  entity: mandate.federation.OAuthClient
- instance: server
  entity: mandate.credential.ResourceServer
- instance: session
  entity: mandate.identity.Session
  setup:
    identity: 00000000-0000-4000-8000-0000000000f1
    fields:
      principal_id: 00000000-0000-4000-8000-000000000001
      organization_id: 00000000-0000-4000-8000-0000000000a1
      epochs: 00000000-0000-4000-8000-0000000000b1
      expires_at: '2026-01-05T23:00:00Z'
    state: Active
- instance: code
  entity: mandate.credential.AuthorizationCode
  setup:
    identity: 00000000-0000-4000-8000-0000000000d1
    fields:
      client_id: 0c0128ba-2fa1-4d8e-b1b0-8c1d4e5f6a7b
      session_id: 00000000-0000-4000-8000-0000000000f1
      verifier: f7fc02f9a089bbebd7daa7154428ffe86dd58f605a3eb0c8b72c2528b58e2e90
      challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
      method: S256
      redirect_uri: https://app.example.test/callback
      expires_at: '2026-01-05T23:00:00Z'
      target: 400128ba-2fa1-4d8e-b1b0-8c1d4e5f6a7b
      scope:
        actions:
        - document.read
        resources:
        - resource_type: document
          resource_id: 00000000-0000-4000-8000-000000000071
      identity_scopes:
      - OpenId
    state: Issued
timeline:
- at: '2026-01-05T08:59:58Z'
  command: mandate.federation.RegisterOAuthClient
  input:
    context:
      subject: 00000000-0000-4000-8000-000000000001
      organization: 00000000-0000-4000-8000-0000000000a1
      audience: mandate
      credential: 00000000-0000-4000-8000-0000000000c1
      correlation: oidc-redeem-client-auth-client
    client_type: Confidential
    secret_verifiers:
    - kv1.app-a.c2NlbmFyaW8tdmVyaWZpZXItb25l
    redirect_uris:
    - https://app.example.test/callback
    pkce_method: S256
    pkce_required: true
    trusted_peers: []
    post_logout_redirect_uris: []
  outcome: accepted
  events:
  - event: mandate.federation.OAuthClientRegistered
    payload:
      client_type: Confidential
  capture:
    instance: client
    event: mandate.federation.OAuthClientRegistered
    field: id
- at: '2026-01-05T08:59:59Z'
  command: mandate.credential.RegisterResourceServer
  input:
    context:
      subject: 00000000-0000-4000-8000-000000000001
      organization: 00000000-0000-4000-8000-0000000000a1
      audience: mandate
      credential: 00000000-0000-4000-8000-0000000000c1
      correlation: oidc-redeem-client-auth-server
    audience: api-a
    profile:
      name: jwt-api
      kind: SelfContained
      revocation: BoundedOffline
      max_ttl: PT10M
      positive_cache_ttl: PT1M
      requires_online_authorization: false
    allowed_exchange_sources: []
    client_id:
      $instance: client
  outcome: accepted
  events:
  - event: mandate.credential.ResourceServerRegistered
    payload:
      audience: api-a
  capture:
    instance: server
    event: mandate.credential.ResourceServerRegistered
    field: id
- at: '2026-01-05T09:00:00Z'
  command: mandate.credential.RedeemAuthorizationCode
  input:
    code_id:
      $instance: code
    client_id:
      $instance: client
    code: cHJlc2VudGVkLWF1dGhvcml6YXRpb24tY29kZQ==
    pkce_verifier: ZEJqZnRKZVo0Q1ZQLW1COTJLMjd1aGJVSlUxcDFyX3dXMWdGV0ZPRWpYaw==
    redirect_uri: https://app.example.test/callback
    # Twenty-four 0x01 bytes: a placeholder no verifier matches, low-entropy on purpose.
    client_secret: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEB
  outcome: denied
  error:
    name: mandate.credential.Denied
    fields:
      reason: InvalidClient
  no_events:
  - mandate.credential.AuthorizationCodeRedeemed
  - mandate.credential.IdentityTokenIssued
