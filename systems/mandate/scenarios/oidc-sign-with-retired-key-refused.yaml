type: ess-scenario/2
domain: mandate.credential
scenario: oidc-sign-with-retired-key-refused
summary: '`signing algorithm or key is unadmitted`: the one key left is retired, its successor revoked; issuance draws nothing; keys::signing_admitted; corpus: none.'
arrange:
- instance: server
  entity: mandate.credential.ResourceServer
- instance: retired-key
  entity: mandate.credential.SigningKey
- instance: revoked-key
  entity: mandate.credential.SigningKey
timeline:
- at: '2026-01-05T09:00:00Z'
  command: mandate.credential.RegisterResourceServer
  input:
    context:
      subject: 00000000-0000-4000-8000-000000000001
      organization: 00000000-0000-4000-8000-0000000000a1
      audience: mandate
      credential: 00000000-0000-4000-8000-0000000000c1
      correlation: oidc-sign-retired-server
    audience: api-a
    profile:
      name: jwt-api
      kind: SelfContained
      revocation: BoundedOffline
      max_ttl: PT10M
      positive_cache_ttl: PT1M
      requires_online_authorization: false
