type: ess-scenario/2
domain: mandate.federation
scenario: oidc-authorize-public-without-pkce-refused
summary: '`PKCE is absent where the client requires it`: a public client, which always requires PKCE, authorizing with no challenge is denied and issues no code (fork F3); corpus: none.'
arrange:
- instance: client
  entity: mandate.federation.OAuthClient
- instance: server
  entity: mandate.credential.ResourceServer
timeline:
- at: '2026-01-05T09:00:00Z'
  command: mandate.federation.RegisterOAuthClient
  input:
    context:
      subject: 00000000-0000-4000-8000-000000000001
      organization: 00000000-0000-4000-8000-0000000000a1
      audience: mandate
      credential: 00000000-0000-4000-8000-0000000000c1
      correlation: oidc-authorize-public-without-pkce-refused-client
    client_type: Public
    secret_verifiers: []
    redirect_uris:
    - https://app.example.test/callback
    pkce_method: S256
    pkce_required: true
    trusted_peers: []
    post_logout_redirect_uris: []
  outcome: accepted
  events:
  - event: mandate.federation.OAuthClientRegistered
    payload:
      client_type: Public
  capture:
    instance: client
    event: mandate.federation.OAuthClientRegistered
    field: id
- at: '2026-01-05T09:00:01Z'
  command: mandate.credential.RegisterResourceServer
  input:
    context:
      subject: 00000000-0000-4000-8000-000000000001
      organization: 00000000-0000-4000-8000-0000000000a1
      audience: mandate
      credential: 00000000-0000-4000-8000-0000000000c1
      correlation: oidc-authorize-public-without-pkce-refused-server
    audience: app
    profile:
      name: jwt-api
      kind: SelfContained
      revocation: BoundedOffline
      max_ttl: PT10M
      positive_cache_ttl: PT1M
      requires_online_authorization: false
    allowed_exchange_sources: []
    client_id:
      $instance: client
  outcome: accepted
  events:
  - event: mandate.credential.ResourceServerRegistered
    payload:
      audience: app
  capture:
    instance: server
    event: mandate.credential.ResourceServerRegistered
    field: id
- at: '2026-01-05T09:00:02Z'
  command: mandate.federation.AuthorizeClient
  input:
    client_id:
      $instance: client
    redirect_uri: https://app.example.test/callback
    state: oidc-authorize-public-without-pkce-refused-state
    nonce: oidc-authorize-public-without-pkce-refused-nonce
    session_proof: c2Vzc2lvbi1wcm9vZi1mb3ItdXNlcg==
    requested_scope:
      actions: []
      resources: []
    identity_scopes:
    - OpenId
  outcome: denied
  error:
    name: mandate.federation.Denied
    fields:
      reason: Denied
  no_events:
  - mandate.federation.AuthorizationCodeIssued
