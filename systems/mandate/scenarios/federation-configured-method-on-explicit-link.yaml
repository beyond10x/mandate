type: ess-scenario/2
domain: mandate.federation
scenario: federation-configured-method-on-explicit-link
summary: '`Caller/method lacks linking authority`: the principal is linked in the connection''s organization, so the method is the first guard; link.rs:95-96; corpus: none.'
arrange:
- instance: conn
  entity: mandate.federation.FederationConnection
- instance: link
  entity: mandate.federation.ExternalPrincipal
  setup:
    identity: 00000000-0000-4000-8000-0000000000cb
    fields:
      organization_id: 00000000-0000-4000-8000-0000000000a1
      subject: u-0
      principal_id: 00000000-0000-4000-8000-000000000001
      connection_id: 00000000-0000-4000-8000-0000000000ca
      link_method: Administrator
      linked_at: '2026-01-05T08:00:00Z'
    state: Linked
timeline:
- at: '2026-01-05T09:00:00Z'
  command: mandate.federation.RegisterFederationConnection
  input:
    context:
      subject: 00000000-0000-4000-8000-000000000001
      organization: 00000000-0000-4000-8000-0000000000a1
      audience: mandate
      credential: 00000000-0000-4000-8000-0000000000c1
      correlation: federation-configured-method
    issuer: https://idp.example.test
    client_id: mandate-client
    tenant_resolution:
      configured_organization: 00000000-0000-4000-8000-0000000000a1
    jit_provisioning: false
  outcome: accepted
  events:
  - event: mandate.federation.FederationConnectionCreated
    payload:
      issuer: https://idp.example.test
  capture:
    instance: conn
    event: mandate.federation.FederationConnectionCreated
    field: connection_id
- at: '2026-01-05T09:00:01Z'
  command: mandate.federation.LinkExternalPrincipal
  input:
    context:
      subject: 00000000-0000-4000-8000-000000000001
      organization: 00000000-0000-4000-8000-0000000000a1
      audience: mandate
      credential: 00000000-0000-4000-8000-0000000000c1
      correlation: federation-configured-method-link
    connection_id:
      $instance: conn
    external_subject: u-1
    principal_id: 00000000-0000-4000-8000-000000000001
    method: ConfiguredFederation
  outcome: denied
  error:
    name: mandate.federation.Denied
    fields:
      reason: Denied
  no_events:
  - mandate.federation.ExternalPrincipalLinked
