      tenant_resolution:
        configured_organization: 00000000-0000-4000-8000-0000000000a1
        verified_claim_name: hd
        verified_claim_values:
        - a.example.test
        - b.example.test
  capture:
    instance: conn
    event: mandate.federation.FederationConnectionCreated
    field: connection_id
