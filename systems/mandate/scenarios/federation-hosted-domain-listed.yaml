type: ess-scenario/2
domain: mandate.federation
scenario: federation-hosted-domain-listed
summary: 'The hd rule lists two hosted domains (F16); a linked login from the second resolves to the configured organization; corpus: none.'
arrange:
- instance: conn
  entity: mandate.federation.FederationConnection
timeline:
- at: '2026-01-05T09:00:00Z'
  command: mandate.federation.RegisterFederationConnection
  input:
    context:
      subject: 00000000-0000-4000-8000-000000000001
      organization: 00000000-0000-4000-8000-0000000000a1
      audience: mandate
      credential: 00000000-0000-4000-8000-0000000000c1
      correlation: federation-hosted-domain-listed
    issuer: https://idp.example.test
    client_id: mandate-client
    tenant_resolution:
      configured_organization: 00000000-0000-4000-8000-0000000000a1
      verified_claim_name: hd
      verified_claim_values:
      - a.example.test
      - b.example.test
    jit_provisioning: false
    subject_format: MandatePrincipal
  outcome: accepted
  events:
  - event: mandate.federation.FederationConnectionCreated
