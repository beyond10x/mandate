      credential: 00000000-0000-4000-8000-0000000000c1
      correlation: oidc-client-public-pkce-optional
    client_type: Public
    secret_verifiers: []
    redirect_uris:
    - https://app.example.test/callback
    pkce_method: S256
    pkce_required: false
    trusted_peers: []
    post_logout_redirect_uris: []
  outcome: denied
  error:
    name: mandate.federation.Denied
    fields:
      reason: Denied
