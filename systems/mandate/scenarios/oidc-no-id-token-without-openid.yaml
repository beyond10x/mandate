type: ess-scenario/2
domain: mandate.credential
scenario: oidc-no-id-token-without-openid
summary: '`accepted`: the same redemption of a code whose authorization granted profile and not openid issues the access credential alone; AuthorizationCodeRedeemed, no IdentityTokenIssued; corpus: none.'
arrange:
- instance: server
  entity: mandate.credential.ResourceServer
  setup:
    identity: 00000000-0000-4000-8000-0000000000e9
    fields:
      organization_id: 00000000-0000-4000-8000-0000000000a1
      audience: api-a
      credential_profile:
        name: jwt-api
        kind: SelfContained
        revocation: BoundedOffline
        max_ttl: PT10M
        positive_cache_ttl: PT1M
        requires_online_authorization: false
      allowed_exchange_sources: []
    state: Enabled
- instance: client
  entity: mandate.federation.OAuthClient
  setup:
    identity: 00000000-0000-4000-8000-0000000000c9
    fields:
      organization_id: 00000000-0000-4000-8000-0000000000a1
      client_type: Public
      secret_verifiers: []
      redirect_uris:
      - https://app.example.test/callback
      pkce_method: S256
      pkce_required: true
      trusted_peers: []
      post_logout_redirect_uris: []
    state: Recorded
- instance: session
  entity: mandate.identity.Session
  setup:
    identity: 00000000-0000-4000-8000-0000000000f1
    fields:
      principal_id: 00000000-0000-4000-8000-000000000001
      organization_id: 00000000-0000-4000-8000-0000000000a1
      epochs: 00000000-0000-4000-8000-0000000000b1
      expires_at: '2026-01-05T23:00:00Z'
    state: Active
- instance: key
  entity: mandate.credential.SigningKey
  setup:
    identity: 00000000-0000-4000-8000-0000000000a9
    fields:
      key_reference: secret/signing/current
      thumbprint: c2NlbmFyaW8tc2lnbmluZy1rZXk
      algorithm: ES256
      window:
        not_before: '2026-01-05T08:00:00Z'
        expires_at: '2026-04-05T08:00:00Z'
    state: Recorded
- instance: code
  entity: mandate.credential.AuthorizationCode
  setup:
    identity: 00000000-0000-4000-8000-0000000000d1
    fields:
      client_id: 00000000-0000-4000-8000-0000000000c9
      session_id: 00000000-0000-4000-8000-0000000000f1
      verifier: f7fc02f9a089bbebd7daa7154428ffe86dd58f605a3eb0c8b72c2528b58e2e90
      challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
      method: S256
      redirect_uri: https://app.example.test/callback
      expires_at: '2026-01-05T23:00:00Z'
      target: 00000000-0000-4000-8000-0000000000e9
      scope:
        actions:
        - document.read
        resources:
        - resource_type: document
          resource_id: 00000000-0000-4000-8000-000000000071
      identity_scopes:
      - Profile
    state: Issued
timeline:
- at: '2026-01-05T09:00:00Z'
  command: mandate.credential.RedeemAuthorizationCode
  input:
    code_id:
      $instance: code
    client_id:
      $instance: client
    code: cHJlc2VudGVkLWF1dGhvcml6YXRpb24tY29kZQ==
    pkce_verifier: ZEJqZnRKZVo0Q1ZQLW1COTJLMjd1aGJVSlUxcDFyX3dXMWdGV0ZPRWpYaw==
    redirect_uri: https://app.example.test/callback
  outcome: accepted
  events:
  - event: mandate.credential.AuthorizationCodeRedeemed
    payload:
      code_id: 00000000-0000-4000-8000-0000000000d1
      target: 00000000-0000-4000-8000-0000000000e9
  no_events:
  - mandate.credential.IdentityTokenIssued
