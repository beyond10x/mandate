# These are the declared deployment boundaries, not the running composition. Today one process, mandate-control-plane (services/control-plane), serves and hosts the mandate-sts handlers in-process; mandate-authorization is asked in-process through mandate_control_plane::authority::DecisionPoint when a deployment is configured to; services/sts, services/authorization and services/worker build scaffold binaries that serve nothing. docs/architecture/ownership.md, "Running composition", records the mapping.
# mandate-control-plane owns mandate.directory, but dependency-boundaries.json admits mandate-provisioning to no service, so no running component links the directory behavior; the story that serves directory commands declares that boundary change in its scope.
components:
  - component: mandate-control-plane
    owns:
      domains:
        - mandate.core
        - mandate.identity
        - mandate.tenancy
        - mandate.federation
        - mandate.directory
        - mandate.delegation
        - mandate.workload
    summary: Administrative deployment and documentation publisher for the shared mandate.core vocabulary. All four deployments compile those shared library types; core is not a remote control-plane runtime dependency. See docs/architecture/ownership.md.
    accepts:
      commands:
        - mandate.identity.DisablePrincipal
        - mandate.identity.RevokeSession
        - mandate.identity.RevokeRefreshCredential
        - mandate.identity.RefreshSession
        - mandate.identity.IncrementSecurityEpoch
        - mandate.tenancy.RemoveOrganizationMembership
        - mandate.tenancy.CreateOrganization
        - mandate.tenancy.CloseOrganization
        - mandate.tenancy.AddOrganizationMembership
        - mandate.tenancy.CreateTeam
        - mandate.tenancy.RetireTeam
        - mandate.tenancy.AddTeamMembership
        - mandate.tenancy.RemoveTeamMembership
        - mandate.tenancy.CreateSpace
        - mandate.tenancy.RetireSpace
        - mandate.federation.UnlinkExternalPrincipal
        - mandate.federation.DisableFederationConnection
        - mandate.federation.LinkExternalPrincipal
        - mandate.federation.RegisterFederationConnection
        - mandate.federation.AuthenticateFederation
        - mandate.federation.AuthorizePublicClient
        - mandate.federation.ProvisionExternalPrincipal
        - mandate.federation.RegisterOAuthClient
        - mandate.federation.DisableOAuthClient
        - mandate.directory.RemoveMembershipContribution
        - mandate.directory.RemoveDirectoryGroupMembership
        - mandate.directory.RemoveDirectoryGroupTeamMapping
        - mandate.directory.CreateDirectoryGroupTeamMapping
        - mandate.directory.SyncDirectoryMembership
        - mandate.directory.RetireDirectoryGroup
        - mandate.directory.CompleteSyncJob
        - mandate.directory.FailSyncJob
        - mandate.delegation.RevokeDelegation
        - mandate.delegation.CreateDelegation
        - mandate.delegation.RetireAgent
        - mandate.delegation.SupersedeAgentCapabilityCeiling
        - mandate.delegation.CompleteExecution
        - mandate.delegation.ConsumeApproval
        - mandate.workload.RevokeWorkloadIdentity
        - mandate.workload.AuthenticateWorkload
    publishes:
      events:
        - mandate.identity.PrincipalDisabled
        - mandate.identity.SessionRevoked
        - mandate.identity.RefreshCredentialRevoked
        - mandate.identity.SessionRefreshed
        - mandate.identity.SecurityEpochIncremented
        - mandate.identity.SessionOpened
        - mandate.identity.EpochSnapshotRecorded
        - mandate.identity.SecurityEpochRecorded
        - mandate.tenancy.OrganizationMembershipRemoved
        - mandate.tenancy.OrganizationCreated
        - mandate.tenancy.OrganizationClosed
        - mandate.tenancy.OrganizationMembershipAdded
        - mandate.tenancy.TeamCreated
        - mandate.tenancy.TeamRetired
        - mandate.tenancy.TeamMembershipAdded
        - mandate.tenancy.TeamMembershipRemoved
        - mandate.tenancy.SpaceCreated
        - mandate.tenancy.SpaceRetired
        - mandate.federation.ExternalPrincipalUnlinked
        - mandate.federation.FederationConnectionDisabled
        - mandate.federation.ExternalPrincipalLinked
        - mandate.federation.FederationConnectionCreated
        - mandate.federation.FederationAuthenticated
        - mandate.federation.AuthorizationCodeIssued
        - mandate.federation.ExternalPrincipalProvisioned
        - mandate.federation.OAuthClientRegistered
        - mandate.federation.OAuthClientDisabled
        - mandate.directory.DirectoryGroupRecorded
        - mandate.directory.SyncJobRecorded
        - mandate.directory.DirectoryGroupMembershipRecorded
        - mandate.directory.MembershipContributionRecorded
        - mandate.directory.MembershipContributionRemoved
        - mandate.directory.DirectoryGroupMembershipRemoved
        - mandate.directory.DirectoryGroupTeamMappingRemoved
        - mandate.directory.DirectoryGroupTeamMappingCreated
        - mandate.directory.DirectoryGroupMembershipChanged
        - mandate.directory.DirectoryGroupRetired
        - mandate.directory.SyncJobCompleted
        - mandate.directory.SyncJobFailed
        - mandate.delegation.DelegationRevoked
        - mandate.delegation.DelegationCreated
        - mandate.delegation.AgentRetired
        - mandate.delegation.AgentCapabilityCeilingSuperseded
        - mandate.delegation.ExecutionCompleted
        - mandate.delegation.ApprovalConsumed
        - mandate.workload.WorkloadIdentityRevoked
        - mandate.workload.WorkloadAuthenticated
  - component: mandate-authorization
    owns:
      domains:
        - mandate.graph
        - mandate.policy
        - mandate.authorization
    summary: Planned deployment boundary; exact domain-to-library responsibilities and required adapter/worker gaps are recorded in docs/architecture/ownership.md.
    accepts:
      commands:
        - mandate.graph.RemoveRelation
        - mandate.graph.RevokeGrant
        - mandate.graph.RegisterResource
        - mandate.graph.WriteRelationship
        - mandate.graph.DeregisterResource
        - mandate.authorization.Check
        - mandate.authorization.CheckWithApproval
        - mandate.policy.SupersedePolicy
        - mandate.policy.SupersedeAuthorizationModel
    publishes:
      events:
        - mandate.graph.RelationRemoved
        - mandate.graph.GrantRevoked
        - mandate.graph.ResourceRegistered
        - mandate.graph.RelationshipWritten
        - mandate.graph.ResourceDeregistered
        - mandate.authorization.DecisionRecorded
        - mandate.authorization.ApprovedDecisionRecorded
        - mandate.policy.PolicySuperseded
        - mandate.policy.AuthorizationModelSuperseded
  - component: mandate-sts
    owns:
      domains:
        - mandate.credential
    summary: Planned deployment boundary; exact domain-to-library responsibilities and required adapter/worker gaps are recorded in docs/architecture/ownership.md.
    accepts:
      commands:
        - mandate.credential.DisableResourceServer
        - mandate.credential.RevokeAccessCredential
        - mandate.credential.RedeemAuthorizationCode
        - mandate.credential.RegisterResourceServer
        - mandate.credential.IssueReferenceCredential
        - mandate.credential.IssueSelfContainedCredential
        - mandate.credential.ExchangeCredential
        - mandate.credential.IntrospectCredential
        - mandate.credential.IssueAuthorizationCode
        - mandate.credential.RegisterSigningKey
        - mandate.credential.RetireSigningKey
        - mandate.credential.RevokeSigningKey
    publishes:
      events:
        - mandate.credential.ResourceServerDisabled
        - mandate.credential.AccessCredentialRevoked
        - mandate.credential.AuthorizationCodeRedeemed
        - mandate.credential.ResourceServerRegistered
        - mandate.credential.CredentialReferenceIssued
        - mandate.credential.CredentialSelfContainedIssued
        - mandate.credential.TokenExchangeAllowed
        - mandate.credential.CredentialIntrospected
        - mandate.credential.TokenExchangeDenied
        - mandate.credential.AuthorizationCodeIssued
        - mandate.credential.SigningKeyRegistered
        - mandate.credential.SigningKeyRetired
        - mandate.credential.SigningKeyRevoked
        - mandate.credential.IdentityTokenIssued
  - component: mandate-worker
    owns:
      domains:
        - mandate.audit
    summary: Planned deployment boundary; exact domain-to-library responsibilities and required adapter/worker gaps are recorded in docs/architecture/ownership.md.
    publishes:
      events:
        - mandate.audit.ExternalPrincipalUnlinked
        - mandate.audit.FederationConnectionChanged
        - mandate.audit.TokenExchangeDenied
        - mandate.audit.DirectoryGroupCreated
        - mandate.audit.CredentialRevoked
        - mandate.audit.AuditEventRecorded
        - mandate.audit.AuditEventRedacted
    accepts:
      commands:
        - mandate.audit.RecordAuditEvent
        - mandate.audit.RedactAuditEvent
