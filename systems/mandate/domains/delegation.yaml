# Lifecycle is immutable-with-status: nothing is destroyed, and every change is a new recorded state; see decision-blocker:lifecycle and docs/adr/0009-event-sourced-persistence.md.
# A capability ceiling is immutable: a changed ceiling is a new record and the previous one is superseded, which is how one current ceiling per (agent, organization-or-platform) stays true.
# An execution is never expired by a recorded move: eligibility is read from expires_at, and completion is the only declared transition.
# An approval is one-use and is never reinstated: it is consumed by exactly one decision, or it expires by its own expires_at with no recorded move.
# A ceiling has its own identity. organization_id absent means a platform ceiling; present means a tenant ceiling. All applicable platform/tenant ceilings intersect.
# UNMAPPED-UNIQUENESS: enforce one current ceiling per (agent, organization-or-platform), with trusted Agent-kind and organization checks.
# CreateDelegation fixes transitive=false; the entity invariant also refuses transitive declarations.
domain: mandate.delegation
entities:
  - name: mandate.delegation.Delegation
    identity:
      name: id
      type: mandate.core.DelegationId
    fields:
      - name: organization_id
        type: mandate.core.OrganizationId
      - name: delegator
        type: mandate.core.PrincipalId
      - name: delegate
        type: mandate.core.PrincipalId
      - name: scope
        type: mandate.core.AuthorityScope
      - name: audience
        type: mandate.core.Audience
      - name: not_before
        type: Optional<Timestamp>
      - name: expires_at
        type: Timestamp
      - name: execution_binding
        type: Optional<mandate.core.ExecutionId>
      - name: transitive
        type: Boolean
      - name: created_at
        type: Timestamp
    lifecycle:
      initial: Active
      states:
        - Active
        - Revoked
      terminal:
        - Revoked
      transitions:
        - name: revoke
          from:
            - Active
          to: Revoked
    relations:
      - name: organization_id_record
        kind: references
        target: mandate.tenancy.Organization
        cardinality: one
        via: organization_id
      - name: delegator_record
        kind: references
        target: mandate.identity.Principal
        cardinality: one
        via: delegator
      - name: delegate_record
        kind: references
        target: mandate.identity.Principal
        cardinality: one
        via: delegate
      - name: execution_binding_record
        kind: references
        target: mandate.delegation.Execution
        cardinality: one
        via: execution_binding
    invariants:
      - transitive == false
  - name: mandate.delegation.Agent
    identity:
      name: id
      type: mandate.core.PrincipalId
    fields:
      - name: organization_id
        type: mandate.core.OrganizationId
      - name: agent_type
        type: String
    lifecycle:
      initial: Recorded
      states:
        - Recorded
        - Retired
      terminal:
        - Retired
      transitions:
        - name: retire
          from:
            - Recorded
          to: Retired
    relations:
      - name: organization_id_record
        kind: references
        target: mandate.tenancy.Organization
        cardinality: one
        via: organization_id
  - name: mandate.delegation.AgentCapabilityCeiling
    identity:
      name: id
      type: mandate.core.AgentCapabilityCeilingId
    fields:
      - name: agent_id
        type: mandate.core.PrincipalId
      - name: organization_id
        type: Optional<mandate.core.OrganizationId>
      - name: allowed_actions
        type: List<mandate.core.ActionPattern>
      - name: denied_actions
        type: List<mandate.core.ActionPattern>
      - name: scope
        type: mandate.core.AuthorityScope
      - name: max_delegation_ttl
        type: Duration
    lifecycle:
      initial: Recorded
      states:
        - Recorded
        - Superseded
      terminal:
        - Superseded
      transitions:
        - name: supersede
          from:
            - Recorded
          to: Superseded
    relations:
      - name: organization_id_record
        kind: references
        target: mandate.tenancy.Organization
        cardinality: one
        via: organization_id
      - name: agent_record
        kind: references
        target: mandate.identity.Principal
        cardinality: one
        via: agent_id
  - name: mandate.delegation.Execution
    identity:
      name: id
      type: mandate.core.ExecutionId
    fields:
      - name: organization_id
        type: mandate.core.OrganizationId
      - name: agent_id
        type: mandate.core.PrincipalId
      - name: subject
        type: Optional<mandate.core.PrincipalId>
      - name: delegation_id
        type: Optional<mandate.core.DelegationId>
      - name: initiating_session
        type: Optional<mandate.core.SessionId>
      - name: created_at
        type: Timestamp
      - name: expires_at
        type: Timestamp
      - name: policy_version
        type: mandate.core.PolicyVersion
    lifecycle:
      initial: Recorded
      states:
        - Recorded
        - Completed
      terminal:
        - Completed
      transitions:
        - name: complete
          from:
            - Recorded
          to: Completed
    relations:
      - name: organization_id_record
        kind: references
        target: mandate.tenancy.Organization
        cardinality: one
        via: organization_id
      - name: agent_id_record
        kind: references
        target: mandate.identity.Principal
        cardinality: one
        via: agent_id
      - name: subject_record
        kind: references
        target: mandate.identity.Principal
        cardinality: one
        via: subject
      - name: delegation_id_record
        kind: references
        target: mandate.delegation.Delegation
        cardinality: one
        via: delegation_id
      - name: initiating_session_record
        kind: references
        target: mandate.identity.Session
        cardinality: one
        via: initiating_session
  - name: mandate.delegation.Approval
    identity:
      name: id
      type: mandate.core.ApprovalId
    fields:
      - name: organization_id
        type: mandate.core.OrganizationId
      - name: subject
        type: mandate.core.PrincipalId
      - name: actor
        type: Optional<mandate.core.PrincipalId>
      - name: action
        type: mandate.core.Action
      - name: resource
        type: mandate.core.ResourceRef
      - name: expires_at
        type: Timestamp
      - name: approver
        type: mandate.core.PrincipalId
    lifecycle:
      initial: Recorded
      states:
        - Recorded
        - Consumed
      terminal:
        - Consumed
      transitions:
        - name: consume
          from:
            - Recorded
          to: Consumed
    relations:
      - name: organization_id_record
        kind: references
        target: mandate.tenancy.Organization
        cardinality: one
        via: organization_id
      - name: subject_record
        kind: references
        target: mandate.identity.Principal
        cardinality: one
        via: subject
      - name: actor_record
        kind: references
        target: mandate.identity.Principal
        cardinality: one
        via: actor
      - name: approver_record
        kind: references
        target: mandate.identity.Principal
        cardinality: one
        via: approver
commands:
  - name: mandate.delegation.RevokeDelegation
    input:
      - name: id
        type: mandate.core.DelegationId
      - name: context
        type: mandate.core.VerifiedContext
    outcomes:
      - name: accepted
        emits:
          - mandate.delegation.DelegationRevoked
        payload:
          mandate.delegation.DelegationRevoked:
            context: input.context
            id: input.id
        moves: mandate.delegation.Delegation.revoke
        instance: id
      - name: denied
        external: Caller lacks delegation-revocation authority, delegation is outside the verified organization, or durable revocation and affected exchange invalidation fail.
        error: mandate.delegation.Denied
  - name: mandate.delegation.CreateDelegation
    input:
      - name: context
        type: mandate.core.VerifiedContext
      - name: delegate
        type: mandate.core.PrincipalId
      - name: scope
        type: mandate.core.AuthorityScope
      - name: audience
        type: mandate.core.Audience
      - name: expires_at
        type: Timestamp
      - name: not_before
        type: Optional<Timestamp>
      - name: execution_binding
        type: Optional<mandate.core.ExecutionId>
    outcomes:
      - name: accepted
        emits:
          - mandate.delegation.DelegationCreated
        payload:
          mandate.delegation.DelegationCreated:
            context: input.context
            id:
              response: delegation_id
            delegator:
              generated: true
            delegate: input.delegate
            scope: input.scope
            audience: input.audience
            not_before: input.not_before
            expires_at: input.expires_at
            execution_binding: input.execution_binding
            created_at:
              generated: true
      - name: denied
        external: Caller lacks delegation authority, subject/delegate/tenant/space/registered audience or execution binding fails, requested scope/expiry exceeds source/delegation/policy limits or agent ceilings, or a transitive/approval-required grant would be created.
        error: mandate.delegation.Denied
    response:
      - name: delegation_id
        type: mandate.core.DelegationId
  - name: mandate.delegation.RetireAgent
    input:
      - name: id
        type: mandate.core.PrincipalId
      - name: context
        type: mandate.core.VerifiedContext
    outcomes:
      - name: accepted
        emits:
          - mandate.delegation.AgentRetired
        payload:
          mandate.delegation.AgentRetired:
            context: input.context
            id: input.id
        moves: mandate.delegation.Agent.retire
        instance: id
        summary: The installation is withdrawn, not deleted. A retired agent starts no execution and is admitted by no exchange; its executions, delegations and audit history are preserved, and disabling the agent's principal remains a separate identity command.
      - name: denied
        external: Caller lacks agent-administration authority, the agent is outside the verified organization, or retirement cannot stop new executions and exchanges under its ceiling.
        error: mandate.delegation.Denied
  - name: mandate.delegation.SupersedeAgentCapabilityCeiling
    input:
      - name: id
        type: mandate.core.AgentCapabilityCeilingId
      - name: context
        type: mandate.core.VerifiedContext
    outcomes:
      - name: accepted
        emits:
          - mandate.delegation.AgentCapabilityCeilingSuperseded
        payload:
          mandate.delegation.AgentCapabilityCeilingSuperseded:
            context: input.context
            id: input.id
        moves: mandate.delegation.AgentCapabilityCeiling.supersede
        instance: id
        summary: A ceiling is never edited. The replacement is a new ceiling record and this one stops being current, which is what keeps exactly one current ceiling per (agent, organization-or-platform); every applicable platform and tenant ceiling still intersects.
      - name: denied
        external: Caller lacks ceiling-administration authority, the ceiling is outside the verified organization or platform scope, no later ceiling covers the same agent and scope, or supersession cannot take effect before the next exchange is evaluated.
        error: mandate.delegation.Denied
  - name: mandate.delegation.CompleteExecution
    input:
      - name: id
        type: mandate.core.ExecutionId
      - name: context
        type: mandate.core.VerifiedContext
    outcomes:
      - name: accepted
        emits:
          - mandate.delegation.ExecutionCompleted
        payload:
          mandate.delegation.ExecutionCompleted:
            context: input.context
            id: input.id
        moves: mandate.delegation.Execution.complete
        instance: id
        summary: The recorded end of one agent invocation. No further tool call is admitted under the execution; the record, its delegation binding and its policy version are preserved. An execution past expires_at is ineligible without any recorded move.
      - name: denied
        external: Caller is not the agent runtime that holds this execution, the execution is outside the verified organization, or completion cannot durably stop further tool calls bound to it.
        error: mandate.delegation.Denied
  - name: mandate.delegation.ConsumeApproval
    input:
      - name: id
        type: mandate.core.ApprovalId
      - name: context
        type: mandate.core.VerifiedContext
    outcomes:
      - name: accepted
        emits:
          - mandate.delegation.ApprovalConsumed
        payload:
          mandate.delegation.ApprovalConsumed:
            context: input.context
            id: input.id
        moves: mandate.delegation.Approval.consume
        instance: id
        summary: One approval satisfies exactly one decision. Consumption commits with the decision that used it; a consumed approval never satisfies a second check and is never reinstated.
      - name: denied
        external: Caller does not hold the decision context the approval answers, the approval is outside the verified organization, its subject/actor/action/resource or expiry does not match the check being satisfied, or one-use consumption cannot commit atomically with that decision.
        error: mandate.delegation.Denied
events:
  - name: mandate.delegation.DelegationRevoked
    fields:
      - name: context
        type: mandate.core.VerifiedContext
      - name: id
        type: mandate.core.DelegationId
  - name: mandate.delegation.DelegationCreated
    fields:
      - name: context
        type: mandate.core.VerifiedContext
      - name: id
        type: mandate.core.DelegationId
      - name: delegator
        type: mandate.core.PrincipalId
      - name: delegate
        type: mandate.core.PrincipalId
      - name: scope
        type: mandate.core.AuthorityScope
      - name: audience
        type: mandate.core.Audience
      - name: not_before
        type: Optional<Timestamp>
      - name: expires_at
        type: Timestamp
      - name: execution_binding
        type: Optional<mandate.core.ExecutionId>
      - name: created_at
        type: Timestamp
  - name: mandate.delegation.AgentRetired
    fields:
      - name: context
        type: mandate.core.VerifiedContext
      - name: id
        type: mandate.core.PrincipalId
  - name: mandate.delegation.AgentCapabilityCeilingSuperseded
    fields:
      - name: context
        type: mandate.core.VerifiedContext
      - name: id
        type: mandate.core.AgentCapabilityCeilingId
  - name: mandate.delegation.ExecutionCompleted
    fields:
      - name: context
        type: mandate.core.VerifiedContext
      - name: id
        type: mandate.core.ExecutionId
  - name: mandate.delegation.ApprovalConsumed
    fields:
      - name: context
        type: mandate.core.VerifiedContext
      - name: id
        type: mandate.core.ApprovalId
errors:
  - name: mandate.delegation.Denied
    summary: Fail closed; no credential, authority or lifecycle mutation on refusal.
    fields:
      - name: reason
        type: mandate.core.DenialReason
