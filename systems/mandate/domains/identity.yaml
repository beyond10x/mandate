# UNMAPPED-EPOCH: PrincipalEpoch, OrganizationSecurityEpoch and FederationEpoch require exact u64 monotonic semantics; see decision-blocker:epoch.
# UNMAPPED-ATOMICITY: snapshot invalidation and refresh must be transactional; see decision-blocker:epoch-atomicity.
# Generation records are ownership declarations keyed independently by principal, organization or federation connection; each declares one generation, an Integer constrained non-negative by its entity invariant.
# UNMAPPED-EPOCH: Integer is the recorded stand-in for the addendum's u64 (decision-blocker:epoch; architecture-addendum.md section 6.3), widened when ESS gains an unsigned primitive. Monotonic increment, denial at the maximum and per-dimension snapshot values remain absent; EpochSnapshotRef is only an immutable record handle, never an epoch number.
# UNMAPPED-EPOCH-OWNERSHIP: ESS relation carriers cannot reference an entity identity directly; each generation identity is its owning PrincipalId, OrganizationId or FederationConnectionId (one-to-one association).
# IncrementSecurityEpoch remains an adapter obligation; no fabricated self-loop stands in for numeric mutation.
# mandate.federation.AuthenticateFederation's accepted outcome creates mandate.identity.Session, with session_id on FederationAuthenticated as its instance. That event carries the whole Session record — session_id, principal_id, organization_id, connection_id, epochs, expires_at — so the identity fold materializes the session from it alone, reading no command input or response. The audience and the correlation ride beside the record and are not Session fields.
# SessionOpened carries the same six Session fields for a session opened without federation. No command in this contract declares such an open, so no outcome emits it today, and it is reserved rather than dead: the writer is the mandate-control-plane component that publishes it (components.yaml). The two events name the record's identity differently — SessionOpened by id, FederationAuthenticated by session_id — and the two are one opening rule: a session identity any recorded event names has been opened once, so a second open by either event, after either event, is refused at append and never reaches the fold (mandate-identity IdentityLog::try_record, through IdentityLog::refusal). That refusal is the adapter's: this file declares none, because no invariant, view, open command or outcome in the compiled model could carry one.
# mandate.identity.Principal is seeded by mandate.federation.ExternalPrincipalProvisioned, which carries principal_id, kind and display_name — the whole Principal record — and the identity fold materializes the principal from that event alone. No command in this contract declares the Principal's creation: ProvisionExternalPrincipal's accepted outcome spends its one subject on mandate.federation.ExternalPrincipal, and an ESS outcome declares one creates/moves/updates, so the writer is declared here rather than by a second creates:. A principal named by LinkExternalPrincipal rather than provisioned is seeded by no event today and has no record until a command creates one; that command is story:declared-writers' remaining unit, not this file's. The seeding event binds kind to the literal User, so this contract declares a writer for User principals alone: Agent, Service and ServiceAccount principals of mandate.core.PrincipalKind have none, and mandate.delegation.Agent and mandate.workload.WorkloadIdentity are records of principals that are not users. The three scenarios ess verify conform synthesize refuses for mandate.identity.Principal stay refused until a RegisterPrincipal command lands (story:declared-writers, a later wave); this declaration closes the federated first login and nothing else.
# EpochSnapshotRecorded and SecurityEpochRecorded are the seeding events for the snapshot and the generation each dimension held. No command outcome creates a snapshot or a generation record and no outcome emits either event, so the adapter writes one per record it seeds and the identity fold consumes them. AuthenticateFederation mints the snapshot handle the session is bound to; the snapshot's own contents arrive on EpochSnapshotRecorded. Precedent for a declared event no command outcome emits: domains/audit.yaml, published by mandate-worker.
# mandate.identity.RefreshCredential is seeded by RefreshCredentialIssued, which carries the whole record of a family's first member — id, family_id, client_id, principal_id, organization_id, session_id, verifier, epochs, issued_at, expires_at — and the identity fold materializes it Active, with no predecessor, no last_used_at and no sibling spent. No command in this contract declares that issuance: the STS issues the first member at code redemption when offline_access was granted (story:oidc-refresh-and-logout, runtime half), and mandate.credential.RedeemAuthorizationCode spends its one subject on the code it consumes. Precedent for a declared event no command outcome emits: EpochSnapshotRecorded above.
# RotateRefreshCredential's rotated and grace-sibling outcomes spend their one subject on the presented credential, so the successor (or sibling) is seeded by RefreshCredentialRotated, which carries its whole record with predecessor set to the presented credential and the family's absolute expires_at; the fold materializes it Active. RotateRefreshCredential.id is resolved by the trusted adapter from the presented refresh token, as RedeemAuthorizationCode.code_id is (domains/credential.yaml); it is not a selector a caller chooses.
# RefreshFamilyRevoked also revokes the Session it names: the identity fold moves that session to Revoked when it folds the event. An affects: entry cannot select the session by its identity — `where: id == subject.session_id` is refused as "`id` reads `id`, which is not a declared observable root" (ESS-COMMAND-003, unobservable_fact) — so the session half of fork F6's reuse rule is declared here, and the family half is the reuse-detected outcome's affects:.
# Reuse is an accepting outcome, not a refusal: ESS admits no event and no affects: on a refusal (refusal_mutated_state, ESS-COMMAND-004; compensates: true admits neither), and reuse must publish RefreshFamilyRevoked and revoke the family. reuse-detected returns no response, and the token endpoint answers it as invalid_grant.
domain: mandate.identity
types:
  - name: mandate.identity.RefreshFamilyId
    kind: newtype
    of: Uuid
    naming:
      summary: The rotation family of refresh credentials minted from one issuance.
entities:
  - name: mandate.identity.Principal
    identity:
      name: id
      type: mandate.core.PrincipalId
    fields:
      - name: kind
        type: mandate.core.PrincipalKind
      - name: display_name
        type: String
    lifecycle:
      initial: Active
      states:
        - Active
        - Disabled
      terminal:
        - Disabled
      transitions:
        - name: disable
          from:
            - Active
          to: Disabled
  - name: mandate.identity.Session
    identity:
      name: id
      type: mandate.core.SessionId
    fields:
      - name: principal_id
        type: mandate.core.PrincipalId
      - name: organization_id
        type: mandate.core.OrganizationId
      - name: connection_id
        type: Optional<mandate.core.FederationConnectionId>
      - name: epochs
        type: mandate.core.EpochSnapshotRef
      - name: expires_at
        type: Timestamp
    lifecycle:
      initial: Active
      states:
        - Active
        - Revoked
      terminal:
        - Revoked
      transitions:
        - name: revoke
          from:
            - Active
          to: Revoked
    relations:
      - name: principal_id_record
        kind: references
        target: mandate.identity.Principal
        cardinality: one
        via: principal_id
      - name: organization_id_record
        kind: references
        target: mandate.tenancy.Organization
        cardinality: one
        via: organization_id
      - name: connection_id_record
        kind: references
        target: mandate.federation.FederationConnection
        cardinality: one
        via: connection_id
      - name: epoch_snapshot_record
        kind: references
        target: mandate.identity.SecurityEpochSnapshot
        cardinality: one
        via: epochs
  - name: mandate.identity.RefreshCredential
    identity:
      name: id
      type: mandate.core.RefreshCredentialId
    fields:
      - name: principal_id
        type: mandate.core.PrincipalId
      - name: organization_id
        type: mandate.core.OrganizationId
      - name: session_id
        type: mandate.core.SessionId
      - name: verifier
        type: mandate.core.CredentialVerifier
      - name: epochs
        type: mandate.core.EpochSnapshotRef
      - name: expires_at
        type: Timestamp
      - name: family_id
        type: mandate.identity.RefreshFamilyId
        summary: The rotation family. Every credential rotated or sibled from one issued credential carries the family its first member was issued under; reuse revokes the family as one.
      - name: client_id
        type: mandate.core.OAuthClientId
        summary: The client the credential was issued to. Only that client may present it.
      - name: predecessor
        type: Optional<mandate.core.RefreshCredentialId>
        summary: The credential whose rotation minted this one; absent on the family's first member.
      - name: issued_at
        type: Timestamp
      - name: last_used_at
        type: Optional<Timestamp>
        summary: When the credential was first presented and rotated; absent while it is Active. The two-second grace window is measured from it.
      - name: grace_sibling_issued
        type: Boolean
        summary: Whether a presentation inside the grace window has already minted the one sibling a Rotated credential may yield.
    lifecycle:
      initial: Active
      states:
        - Active
        - Rotated
        - Revoked
      terminal:
        - Rotated
        - Revoked
      transitions:
        - name: rotate
          from:
            - Active
          to: Rotated
        - name: revoke
          from:
            - Active
            - Rotated
          to: Revoked
    relations:
      - name: client_id_record
        kind: references
        target: mandate.federation.OAuthClient
        cardinality: one
        via: client_id
      - name: predecessor_record
        kind: references
        target: mandate.identity.RefreshCredential
        cardinality: one
        via: predecessor
      - name: principal_id_record
        kind: references
        target: mandate.identity.Principal
        cardinality: one
        via: principal_id
      - name: organization_id_record
        kind: references
        target: mandate.tenancy.Organization
        cardinality: one
        via: organization_id
      - name: session_id_record
        kind: references
        target: mandate.identity.Session
        cardinality: one
        via: session_id
      - name: epoch_snapshot_record
        kind: references
        target: mandate.identity.SecurityEpochSnapshot
        cardinality: one
        via: epochs
  - name: mandate.identity.SecurityEpochSnapshot
    identity:
      name: id
      type: mandate.core.EpochSnapshotRef
    fields:
      - name: principal_id
        type: mandate.core.PrincipalId
      - name: organization_id
        type: mandate.core.OrganizationId
      - name: connection_id
        type: Optional<mandate.core.FederationConnectionId>
    lifecycle:
      initial: Recorded
      states:
        - Recorded
      terminal:
        - Recorded
    relations:
      - name: principal_record
        kind: references
        target: mandate.identity.Principal
        cardinality: one
        via: principal_id
      - name: organization_id_record
        kind: references
        target: mandate.tenancy.Organization
        cardinality: one
        via: organization_id
      - name: connection_id_record
        kind: references
        target: mandate.federation.FederationConnection
        cardinality: one
        via: connection_id
  - name: mandate.identity.PrincipalSecurityEpoch
    identity:
      name: id
      type: mandate.core.PrincipalId
    fields:
      - name: generation
        type: Integer
    lifecycle:
      initial: Recorded
      states:
        - Recorded
      terminal:
        - Recorded
    invariants:
      - generation >= 0
  - name: mandate.identity.OrganizationSecurityEpoch
    identity:
      name: id
      type: mandate.core.OrganizationId
    fields:
      - name: generation
        type: Integer
    lifecycle:
      initial: Recorded
      states:
        - Recorded
      terminal:
        - Recorded
    invariants:
      - generation >= 0
  - name: mandate.identity.FederationSecurityEpoch
    identity:
      name: id
      type: mandate.core.FederationConnectionId
    fields:
      - name: generation
        type: Integer
    lifecycle:
      initial: Recorded
      states:
        - Recorded
      terminal:
        - Recorded
    invariants:
      - generation >= 0
commands:
  - name: mandate.identity.DisablePrincipal
    input:
      - name: id
        type: mandate.core.PrincipalId
      - name: context
        type: mandate.core.VerifiedContext
    outcomes:
      - name: accepted
        emits:
          - mandate.identity.PrincipalDisabled
        payload:
          mandate.identity.PrincipalDisabled:
            context: input.context
            id: input.id
        moves: mandate.identity.Principal.disable
        instance: id
      - name: wrong-state
        wrong_state: true
        error: mandate.identity.Denied
      - name: denied
        external: Caller lacks principal-administration authority, principal does not exist, or disablement cannot atomically trigger the required session/credential invalidation.
        error: mandate.identity.Denied
  - name: mandate.identity.RevokeSession
    input:
      - name: id
        type: mandate.core.SessionId
      - name: context
        type: mandate.core.VerifiedContext
    outcomes:
      - name: accepted
        emits:
          - mandate.identity.SessionRevoked
        payload:
          mandate.identity.SessionRevoked:
            context: input.context
            id: input.id
        moves: mandate.identity.Session.revoke
        instance: id
        affects:
          - entity: mandate.identity.RefreshCredential
            where: session_id == input.id
            moves: mandate.identity.RefreshCredential.revoke
        summary: Ending the session (RP-initiated logout, fork F7) revokes it and every refresh credential bound to it, Active or Rotated, so no family of the session can be rotated again.
      - name: wrong-state
        wrong_state: true
        error: mandate.identity.Denied
      - name: denied
        external: Caller lacks authority over this session, session is outside the verified organization, or revocation cannot be durably observed under the applicable profile.
        error: mandate.identity.Denied
  - name: mandate.identity.RevokeRefreshCredential
    input:
      - name: id
        type: mandate.core.RefreshCredentialId
      - name: context
        type: mandate.core.VerifiedContext
    outcomes:
      - name: accepted
        emits:
          - mandate.identity.RefreshCredentialRevoked
        payload:
          mandate.identity.RefreshCredentialRevoked:
            context: input.context
            id: input.id
        moves: mandate.identity.RefreshCredential.revoke
        instance: id
      - name: wrong-state
        wrong_state: true
        error: mandate.identity.Denied
      - name: denied
        external: Caller lacks authority over the resolved refresh credential, tenant/session binding mismatches, or durable revocation fails.
        error: mandate.identity.Denied
  - name: mandate.identity.RotateRefreshCredential
    naming:
      summary: Present a refresh credential at the token endpoint and receive its successor (fork F6). The id is resolved by the trusted adapter from the presented refresh token; it is not a selector a caller chooses.
    input:
      - name: id
        type: mandate.core.RefreshCredentialId
      - name: refresh_proof
        type: mandate.core.CredentialProof
      - name: client_id
        type: mandate.core.OAuthClientId
    outcomes:
      - name: wrong-client
        when_subject:
          predicate: client_id != input.client_id
        error: mandate.identity.Denied
        summary: Another client's refresh credential is refused and left exactly as it was; the family is not revoked, because the presenter is not the holder.
      - name: rotated
        when_subject:
          predicate: state == Active
        moves: mandate.identity.RefreshCredential.rotate
        instance: id
        sets:
          last_used_at:
            generated: true
        returns: true
        emits:
          - mandate.identity.RefreshCredentialRotated
        payload:
          mandate.identity.RefreshCredentialRotated:
            predecessor: input.id
            id:
              response: refresh_credential_id
            family_id:
              subject: family_id
            client_id:
              subject: client_id
            principal_id:
              subject: principal_id
            organization_id:
              subject: organization_id
            session_id:
              subject: session_id
            verifier:
              generated: true
            epochs:
              subject: epochs
            issued_at:
              generated: true
            expires_at:
              subject: expires_at
        summary: The presented credential rests in Rotated with the moment it was used; its successor, Active in the same family with the presented credential as predecessor and the family's absolute expiry, is the record RefreshCredentialRotated carries.
      - name: grace-sibling
        when_subject:
          predicate:
            all:
              - state == Rotated
              - grace_sibling_issued == false
              - last_used_at > now - 2s
        updates: mandate.identity.RefreshCredential
        instance: id
        sets:
          grace_sibling_issued: true
        returns: true
        emits:
          - mandate.identity.RefreshCredentialRotated
        payload:
          mandate.identity.RefreshCredentialRotated:
            predecessor: input.id
            id:
              response: refresh_credential_id
            family_id:
              subject: family_id
            client_id:
              subject: client_id
            principal_id:
              subject: principal_id
            organization_id:
              subject: organization_id
            session_id:
              subject: session_id
            verifier:
              generated: true
            epochs:
              subject: epochs
            issued_at:
              generated: true
            expires_at:
              subject: expires_at
        summary: A Rotated credential presented within two seconds of its rotation (a client that lost the first answer) yields exactly one sibling in its family; the credential stays Rotated and records that its sibling is spent.
      - name: reuse-detected
        moves: mandate.identity.RefreshCredential.revoke
        instance: id
        emits:
          - mandate.identity.RefreshFamilyRevoked
        payload:
          mandate.identity.RefreshFamilyRevoked:
            id: input.id
            family_id:
              subject: family_id
            session_id:
              subject: session_id
        affects:
          - entity: mandate.identity.RefreshCredential
            where: family_id == subject.family_id
            moves: mandate.identity.RefreshCredential.revoke
        summary: A Rotated credential presented after the grace window, or a second time within it, is reuse. No credential is returned; the presented credential and every other Active or Rotated member of its family are Revoked, and the session RefreshFamilyRevoked names is revoked by the identity fold (this file's header). The token endpoint answers it as a refusal (invalid_grant).
      - name: wrong-state
        wrong_state: true
        error: mandate.identity.Denied
        summary: A Revoked credential is refused and nothing moves.
      - name: denied
        external: The refresh proof does not match the server-resolved id's verifier, the credential's absolute lifetime is past, client authentication failed, the bound client is disabled, or the principal or session is disabled.
        error: mandate.identity.Denied
    response:
      - name: refresh_credential_id
        type: mandate.core.RefreshCredentialId
      - name: refresh_credential
        type: mandate.core.CredentialSecret
      - name: session_id
        type: mandate.core.SessionId
  - name: mandate.identity.RefreshSession
    input:
      - name: refresh_proof
        type: mandate.core.CredentialProof
    outcomes:
      - name: accepted
        emits:
          - mandate.identity.SessionRefreshed
        payload:
          mandate.identity.SessionRefreshed:
            session_id:
              response: session_id
      - name: denied
        external: Refresh verifier is absent/incorrect, record is expired/revoked, principal/session is disabled, any applicable principal/organization/federation epoch mismatches, or session binding fails.
        error: mandate.identity.Denied
    response:
      - name: session_id
        type: mandate.core.SessionId
  - name: mandate.identity.IncrementSecurityEpoch
    input:
      - name: context
        type: mandate.core.VerifiedContext
      - name: target
        type: mandate.core.SecurityEpochTarget
    outcomes:
      - name: accepted
        emits:
          - mandate.identity.SecurityEpochIncremented
        payload:
          mandate.identity.SecurityEpochIncremented:
            context: input.context
            target: input.target
        summary: "UNMAPPED-EPOCH: this event declares the required increment outcome; no numeric mutation is executed or approximated. The adapter must atomically increment the one selected generation, deny unsigned overflow and preserve isolation of unrelated organizations/connections."
      - name: denied
        external: Caller lacks authority for the explicitly selected principal/organization/federation target, tenant containment fails, the exact unsigned generation is at its maximum, or atomic increment cannot commit.
        error: mandate.identity.Denied
events:
  - name: mandate.identity.PrincipalDisabled
    fields:
      - name: context
        type: mandate.core.VerifiedContext
      - name: id
        type: mandate.core.PrincipalId
  - name: mandate.identity.SessionRevoked
    fields:
      - name: context
        type: mandate.core.VerifiedContext
      - name: id
        type: mandate.core.SessionId
  - name: mandate.identity.RefreshCredentialRevoked
    fields:
      - name: context
        type: mandate.core.VerifiedContext
      - name: id
        type: mandate.core.RefreshCredentialId
  - name: mandate.identity.RefreshCredentialIssued
    fields:
      - name: id
        type: mandate.core.RefreshCredentialId
      - name: family_id
        type: mandate.identity.RefreshFamilyId
      - name: client_id
        type: mandate.core.OAuthClientId
      - name: principal_id
        type: mandate.core.PrincipalId
      - name: organization_id
        type: mandate.core.OrganizationId
      - name: session_id
        type: mandate.core.SessionId
      - name: verifier
        type: mandate.core.CredentialVerifier
      - name: epochs
        type: mandate.core.EpochSnapshotRef
      - name: issued_at
        type: Timestamp
      - name: expires_at
        type: Timestamp
  - name: mandate.identity.RefreshCredentialRotated
    fields:
      - name: predecessor
        type: mandate.core.RefreshCredentialId
      - name: id
        type: mandate.core.RefreshCredentialId
      - name: family_id
        type: mandate.identity.RefreshFamilyId
      - name: client_id
        type: mandate.core.OAuthClientId
      - name: principal_id
        type: mandate.core.PrincipalId
      - name: organization_id
        type: mandate.core.OrganizationId
      - name: session_id
        type: mandate.core.SessionId
      - name: verifier
        type: mandate.core.CredentialVerifier
      - name: epochs
        type: mandate.core.EpochSnapshotRef
      - name: issued_at
        type: Timestamp
      - name: expires_at
        type: Timestamp
  - name: mandate.identity.RefreshFamilyRevoked
    fields:
      - name: id
        type: mandate.core.RefreshCredentialId
      - name: family_id
        type: mandate.identity.RefreshFamilyId
      - name: session_id
        type: mandate.core.SessionId
  - name: mandate.identity.SessionRefreshed
    fields:
      - name: session_id
        type: mandate.core.SessionId
  - name: mandate.identity.SessionOpened
    fields:
      - name: id
        type: mandate.core.SessionId
      - name: principal_id
        type: mandate.core.PrincipalId
      - name: organization_id
        type: mandate.core.OrganizationId
      - name: connection_id
        type: Optional<mandate.core.FederationConnectionId>
      - name: epochs
        type: mandate.core.EpochSnapshotRef
      - name: expires_at
        type: Timestamp
  - name: mandate.identity.EpochSnapshotRecorded
    fields:
      - name: id
        type: mandate.core.EpochSnapshotRef
      - name: principal_id
        type: mandate.core.PrincipalId
      - name: organization_id
        type: mandate.core.OrganizationId
      - name: connection_id
        type: Optional<mandate.core.FederationConnectionId>
  - name: mandate.identity.SecurityEpochRecorded
    fields:
      - name: target
        type: mandate.core.SecurityEpochTarget
      - name: generation
        type: Integer
  - name: mandate.identity.SecurityEpochIncremented
    fields:
      - name: context
        type: mandate.core.VerifiedContext
      - name: target
        type: mandate.core.SecurityEpochTarget
errors:
  - name: mandate.identity.Denied
    summary: Fail closed; no credential, authority or lifecycle mutation on refusal.
    fields:
      - name: reason
        type: mandate.core.DenialReason
summary: "Principal, session and independent principal/organization/federation generation ownership. UNMAPPED-EPOCH: each generation record declares one non-negative Integer generation, the recorded stand-in for the addendum's u64; monotonic increment, denial at the maximum and per-dimension snapshot values are absent until supported. EpochSnapshotRef is an immutable record handle, not a generation number. Refresh and exchange cannot be implemented without closing this blocker."
