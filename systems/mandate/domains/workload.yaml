# Lifecycle is immutable-with-status: nothing is destroyed, and every change is a new recorded state; see decision-blocker:lifecycle and docs/adr/0009-event-sourced-persistence.md.
# A workload identity binds a trust domain and external subject to one principal. Revoking it stops the exchange of workload credentials presented under that binding; the record, and the credentials already issued from it, are refused through their own revocation path rather than deleted.
domain: mandate.workload
entities:
  - name: mandate.workload.WorkloadIdentity
    identity:
      name: id
      type: mandate.core.WorkloadIdentityId
    fields:
      - name: organization_id
        type: mandate.core.OrganizationId
      - name: principal_id
        type: mandate.core.PrincipalId
      - name: trust_domain
        type: mandate.core.TrustDomain
      - name: external_subject
        type: mandate.core.ExternalSubject
    lifecycle:
      initial: Recorded
      states:
        - Recorded
        - Revoked
      terminal:
        - Revoked
      transitions:
        - name: revoke
          from:
            - Recorded
          to: Revoked
    relations:
      - name: organization_id_record
        kind: references
        target: mandate.tenancy.Organization
        cardinality: one
        via: organization_id
      - name: principal_id_record
        kind: references
        target: mandate.identity.Principal
        cardinality: one
        via: principal_id
commands:
  - name: mandate.workload.RevokeWorkloadIdentity
    input:
      - name: id
        type: mandate.core.WorkloadIdentityId
      - name: context
        type: mandate.core.VerifiedContext
    outcomes:
      - name: accepted
        emits:
          - mandate.workload.WorkloadIdentityRevoked
        payload:
          mandate.workload.WorkloadIdentityRevoked:
            context: input.context
            id: input.id
        moves: mandate.workload.WorkloadIdentity.revoke
        instance: id
        summary: The binding stops being admitted. A workload credential presented under this trust domain and subject is refused from that point, and the record is kept so past exchanges stay attributable.
      - name: wrong-state
        wrong_state: true
        error: mandate.workload.Denied
      - name: denied
        external: Caller lacks workload-identity administration authority, the identity is outside the verified organization, or revocation cannot durably stop the exchange of workload credentials presented under the binding.
        error: mandate.workload.Denied
  - name: mandate.workload.AuthenticateWorkload
    input:
      - name: workload_proof
        type: mandate.core.CredentialProof
      - name: agent
        type: mandate.core.PrincipalId
      - name: execution
        type: Optional<mandate.core.ExecutionId>
    outcomes:
      - name: accepted
        emits:
          - mandate.workload.WorkloadAuthenticated
        payload:
          mandate.workload.WorkloadAuthenticated:
            workload:
              response: workload
            runtime:
              response: runtime
            agent: input.agent
            organization:
              response: organization
            execution: input.execution
            authenticated_at:
              generated: true
        summary: Two identities, each authenticated on its own. The workload proof is verified by the trust domain that issued it and resolves to one recorded workload identity, which names the runtime principal; the application agent is a recorded agent of the same organization, not retired, and is never derived from the workload proof. When an execution is named it is recorded, not completed, unexpired, of that organization and that agent. Nothing is created or moved, and the event folds into no record.
      - name: denied
        external: The workload proof is malformed, unverified by its trust domain or expired; it resolves to no workload identity, a revoked one, or one in another organization than the agent; the agent is unrecorded, retired, or its principal disabled; or a named execution is unrecorded, completed, expired, or bound to another agent or organization. Each is refused alike, so a caller learns only that the pair is not admitted.
        error: mandate.workload.Denied
    response:
      - name: workload
        type: mandate.core.WorkloadIdentityId
      - name: runtime
        type: mandate.core.PrincipalId
      - name: organization
        type: mandate.core.OrganizationId
events:
  - name: mandate.workload.WorkloadAuthenticated
    fields:
      - name: workload
        type: mandate.core.WorkloadIdentityId
      - name: runtime
        type: mandate.core.PrincipalId
      - name: agent
        type: mandate.core.PrincipalId
      - name: organization
        type: mandate.core.OrganizationId
      - name: execution
        type: Optional<mandate.core.ExecutionId>
      - name: authenticated_at
        type: Timestamp
  - name: mandate.workload.WorkloadIdentityRevoked
    fields:
      - name: context
        type: mandate.core.VerifiedContext
      - name: id
        type: mandate.core.WorkloadIdentityId
errors:
  - name: mandate.workload.Denied
    summary: Fail closed; no credential, authority or lifecycle mutation on refusal.
    fields:
      - name: reason
        type: mandate.core.DenialReason
