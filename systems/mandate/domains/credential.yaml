# UNMAPPED-DENIAL-AUDIT: ESS error outcomes cannot emit audit events; trusted adapter must durably record denial outside the rejected domain transaction. See decision-blocker:guards.
# UNMAPPED-ALGORITHM-POLICY: SigningAlgorithm is a name, not an admitted algorithm. A verifier-side allowlist is required before issuance/validation.
# Exchange source IDs must resolve to enabled ResourceServer records in the same verified organization; audience text equality cannot admit a source.
# STS alone owns authorization-code verifier storage and consumption. RedeemAuthorizationCode.code_id is resolved by the trusted adapter from proof; it is not a public OAuth parameter or authority selector.
# UNMAPPED-ATOMICITY: verifier check, one-use consumption, credential creation and durable audit outbox commit as one STS transaction. Replay emits no credential.
# The control-plane public-client adapter invokes IssueAuthorizationCode only after authentication, consent/policy and exact client/redirect/S256 checks; this required service call is not an invented asynchronous event binding.
# A signing key is retired for rotation and revoked in an emergency; neither destroys the record, and no command deletes a key (decision-blocker:lifecycle).
# mandate.credential.AuthorizationCodeRedeemed also seeds a mandate.credential.AccessCredential. RedeemAuthorizationCode's accepted outcome spends its one subject on moves of mandate.credential.AuthorizationCode.consume, and an ESS outcome declares one creates/moves/updates, so the credential that redemption issues is declared here rather than by a second creates:. The event carries the whole AccessCredential record — credential_id, descriptor, reference_verifier, epochs, issued_at — beside the target whose registration published the guarantee, exactly the record fields mandate.credential.CredentialReferenceIssued carries, so a fold materializes the credential from the event and the issuing registration the log already holds, reading no command input or response. Its consumer is the mandate-token credential fold (crates/mandate-token/src/projection.rs), where the records of this domain are built; the arm itself is story:oauth-transaction's. The one-subject-per-outcome limit that forces a declaration here rather than a creates: is routed to the ESS wave as creates-entity-discrimination, and this declaration stands until that lands.
# OpenID Provider (docs/adr/0012-openid-provider.md). An authorization code records the OpenID Connect scopes its authorization granted; a redemption of a code that granted openid also issues an identity token, recorded by mandate.credential.IdentityTokenIssued, which carries identifiers and instants and no claim value (fork F13): the email, name and groups an identity token renders are read at issuance from the profile the login recorded and never enter this domain's log. A confidential client authenticates at redemption with a secret checked against the verifiers its registration records (fork F2); a public client presents none. A token exchange whose subject is an identity token is admitted to a target backed by a client that lists the token's client among its trusted peers, in one organization, through the same admission decision as every other exchange (fork F20).
domain: mandate.credential
types:
  # The identifier of one identity token, its `jti`. Distinct from mandate.core.CredentialId: an
  # identity token is not an AccessCredential and no record of this domain is created for it.
  - name: mandate.credential.IdentityTokenId
    kind: newtype
    of: Uuid
  # The OpenID Connect scope values an authorization may grant (OIDC Core 3.1.2.1, 5.4, 11).
  # Mandate actions travel in the code's `scope`; these never do. Each variant is its wire value
  # (openid, email, profile, groups, offline_access) in upper camel case.
  - name: mandate.credential.IdentityScope
    kind: enum
    variants:
      - OpenId
      - Email
      - Profile
      - Groups
      - OfflineAccess
  # RFC 8693 section 3 `subject_token_type`, the two this deployment admits.
  - name: mandate.credential.SubjectTokenType
    kind: enum
    variants:
      - AccessToken
      - IdToken
entities:
  - name: mandate.credential.ResourceServer
    identity:
      name: id
      type: mandate.core.ResourceServerId
    fields:
      - name: organization_id
        type: mandate.core.OrganizationId
      - name: audience
        type: mandate.core.Audience
      - name: credential_profile
        type: mandate.core.CredentialProfile
      - name: allowed_exchange_sources
        type: List<mandate.core.ResourceServerId>
      # The client this registration is the audience of, when it backs one (fork F11, F20).
      - name: client_id
        type: Optional<mandate.core.OAuthClientId>
    lifecycle:
      initial: Enabled
      states:
        - Enabled
        - Disabled
      terminal:
        - Disabled
      transitions:
        - name: disable
          from:
            - Enabled
          to: Disabled
    relations:
      - name: organization_id_record
        kind: references
        target: mandate.tenancy.Organization
        cardinality: one
        via: organization_id
      - name: allowed_exchange_source_records
        kind: references
        target: mandate.credential.ResourceServer
        cardinality: many
        via: allowed_exchange_sources
      - name: client_id_record
        kind: references
        target: mandate.federation.OAuthClient
        cardinality: one
        via: client_id
  - name: mandate.credential.AccessCredential
    identity:
      name: id
      type: mandate.core.CredentialId
    fields:
      - name: descriptor
        type: mandate.core.CredentialDescriptor
      - name: reference_verifier
        type: Optional<mandate.core.CredentialVerifier>
      - name: epochs
        type: Optional<mandate.core.EpochSnapshotRef>
      - name: issued_at
        type: Timestamp
    lifecycle:
      initial: Active
      states:
        - Active
        - Revoked
      terminal:
        - Revoked
      transitions:
        - name: revoke
          from:
            - Active
          to: Revoked
    relations:
      - name: epoch_snapshot_record
        kind: references
        target: mandate.identity.SecurityEpochSnapshot
        cardinality: one
        via: epochs
  - name: mandate.credential.SigningKey
    identity:
      name: id
      type: mandate.core.SigningKeyId
    fields:
      - name: key_reference
        type: mandate.core.KeyReference
      - name: thumbprint
        type: String
      - name: algorithm
        type: mandate.core.SigningAlgorithm
      - name: window
        type: mandate.core.SigningKeyWindow
    lifecycle:
      initial: Recorded
      states:
        - Recorded
        - Retired
        - Revoked
      terminal:
        - Retired
        - Revoked
      transitions:
        - name: retire
          from:
            - Recorded
          to: Retired
        - name: revoke
          from:
            - Recorded
            - Retired
          to: Revoked
    invariants:
      - window.not_before < window.expires_at
  - name: mandate.credential.AuthorizationCode
    identity:
      name: id
      type: mandate.core.AuthorizationCodeId
    fields:
      - name: client_id
        type: mandate.core.OAuthClientId
      - name: session_id
        type: mandate.core.SessionId
      - name: verifier
        type: mandate.core.CredentialVerifier
      - name: challenge
        type: mandate.core.PkceChallenge
      - name: method
        type: mandate.core.PkceMethod
      - name: redirect_uri
        type: mandate.core.RedirectUri
      - name: expires_at
        type: Timestamp
      - name: target
        type: mandate.core.ResourceServerId
      - name: scope
        type: mandate.core.AuthorityScope
      # The OpenID Connect scopes the authorization granted; absent for a plain OAuth code.
      - name: identity_scopes
        type: Optional<List<mandate.credential.IdentityScope>>
    lifecycle:
      initial: Issued
      states:
        - Issued
        - Consumed
      terminal:
        - Consumed
      transitions:
        - name: consume
          from:
            - Issued
          to: Consumed
    relations:
      - name: client_id_record
        kind: references
        target: mandate.federation.OAuthClient
        cardinality: one
        via: client_id
      - name: session_id_record
        kind: references
        target: mandate.identity.Session
        cardinality: one
        via: session_id
      - name: target_record
        kind: references
        target: mandate.credential.ResourceServer
        cardinality: one
        via: target
commands:
  - name: mandate.credential.DisableResourceServer
    input:
      - name: id
        type: mandate.core.ResourceServerId
      - name: context
        type: mandate.core.VerifiedContext
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.ResourceServerDisabled
        payload:
          mandate.credential.ResourceServerDisabled:
            context: input.context
            id: input.id
        moves: mandate.credential.ResourceServer.disable
        instance: id
      - name: wrong-state
        wrong_state: true
        error: mandate.credential.Denied
      - name: denied
        external: Caller lacks resource-server administration authority, server is outside the verified organization, or durable disablement cannot prevent subsequent issuance.
        error: mandate.credential.Denied
  - name: mandate.credential.RevokeAccessCredential
    input:
      - name: id
        type: mandate.core.CredentialId
      - name: context
        type: mandate.core.VerifiedContext
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.AccessCredentialRevoked
        payload:
          mandate.credential.AccessCredentialRevoked:
            context: input.context
            id: input.id
        moves: mandate.credential.AccessCredential.revoke
        instance: id
      - name: wrong-state
        wrong_state: true
        error: mandate.credential.Denied
      - name: denied
        external: Caller lacks credential-revocation authority, resolved credential is outside the verified organization, or the named profile revocation guarantee cannot be met.
        error: mandate.credential.Denied
  - name: mandate.credential.RedeemAuthorizationCode
    input:
      - name: code_id
        type: mandate.core.AuthorizationCodeId
      - name: client_id
        type: mandate.core.OAuthClientId
      - name: code
        type: mandate.core.CredentialProof
      - name: pkce_verifier
        type: mandate.core.CredentialProof
      - name: redirect_uri
        type: mandate.core.RedirectUri
      # The client secret, as client_secret_basic or client_secret_post presented it (RFC 6749
      # section 2.3.1); the adapter refuses a request presenting both. Required of a
      # confidential client, refused from a public one.
      - name: client_secret
        type: Optional<mandate.core.CredentialProof>
    outcomes:
      - name: accepted-with-identity-token
        when_subject:
          predicate:
            exists:
              in: identity_scopes
              as: granted
              that: granted == OpenId
        emits:
          - mandate.credential.AuthorizationCodeRedeemed
          - mandate.credential.IdentityTokenIssued
        payload:
          mandate.credential.AuthorizationCodeRedeemed:
            context:
              generated: true
            code_id: input.code_id
            credential_id:
              response: credential_id
            reference_verifier:
              generated: true
            epochs:
              response: epochs
            issued_at:
              generated: true
            descriptor:
              response: descriptor
            target:
              response: target
          mandate.credential.IdentityTokenIssued:
            token_id:
              generated: true
            code_id: input.code_id
            client_id: input.client_id
            principal_id:
              generated: true
            session_id:
              generated: true
            signing_key_id:
              generated: true
            issued_at:
              generated: true
            expires_at:
              generated: true
        moves: mandate.credential.AuthorizationCode.consume
        instance: code_id
        summary: A code whose authorization granted openid redeems exactly as the accepted outcome below does, and in the same transaction the STS signs one identity token and records mandate.credential.IdentityTokenIssued. The token's issuer is the deployment's, its audience the client, its subject the session's principal (fork F1), its nonce the authorization request's, its auth_time the instant the session's login authenticated and its lifetime the deployment's identity-token lifetime; it is signed under a signing key admitted for issuance now, and the event names that key. The event carries the token's identifier, the code, the client, the principal, the session, the signing key and the two instants, and no claim value — no email, name, groups or nonce enters this log (fork F13). The nonce is held in memory beside the code for the code's lifetime, as the pending sign-in is, and no record or event of this contract carries it; a code outstanding when the STS restarts has no held authorization request and is refused at redemption, and the application starts the sign-in again. A transaction that cannot sign issues neither the token nor the access credential and consumes nothing.
      - name: accepted
        emits:
          - mandate.credential.AuthorizationCodeRedeemed
        payload:
          mandate.credential.AuthorizationCodeRedeemed:
            context:
              generated: true
            code_id: input.code_id
            credential_id:
              response: credential_id
            reference_verifier:
              generated: true
            epochs:
              response: epochs
            issued_at:
              generated: true
            descriptor:
              response: descriptor
            target:
              response: target
        moves: mandate.credential.AuthorizationCode.consume
        instance: code_id
        summary: STS atomically consumes the code and persists the narrowed credential and audit outbox. The returned credential remains bound to the code target, scope, session and expiry; a failed or replayed transaction produces no credential. The command takes no context input and admits no caller-supplied selector — the generated context on the emitted event takes its subject, organization and audience from the code record and the session it names through the STS's session port, its credential as the credential_id this outcome issues, its correlation as the one the outcome mints for this request, and its actor, delegation and execution as absent unless the code record names them. The audience is the one published by the registration the code record's target names. The epoch whose staleness the denial names is the session's own, resolved through that same port, because a redemption presents no source credential of its own. The credential this outcome issues is recorded by mandate.credential.AuthorizationCodeRedeemed, which carries the whole mandate.credential.AccessCredential record, and the epoch snapshot it binds is the one this command answers in its response; the outcome's one subject stays the code it consumes, so the seeding is declared in this domain's header.
      - name: wrong-state
        wrong_state: true
        error: mandate.credential.Denied
      - name: denied
        external: Code proof does not match the server-resolved code_id; code is expired; client, redirect URI or S256 verifier mismatches; the bound client is disabled; a confidential client presents no secret or one matching none of its recorded verifiers; a public client presents a secret; source/session epoch is stale; registered target is disabled or outside the verified tenant; no signing key is admitted for issuance when an identity token is due; a code that granted openid has no authorization request held beside it since a restart; or narrowing/atomic issuance validation fails.
        error: mandate.credential.Denied
    response:
      - name: credential
        type: mandate.core.CredentialSecret
      - name: credential_id
        type: mandate.core.CredentialId
      - name: epochs
        type: Optional<mandate.core.EpochSnapshotRef>
      - name: target
        type: mandate.core.ResourceServerId
      - name: descriptor
        type: mandate.core.CredentialDescriptor
      # The signed identity token, present exactly when the code granted openid.
      - name: id_token
        type: Optional<mandate.core.CredentialSecret>
      # The access credential's remaining lifetime at issuance (RFC 6749 section 5.1).
      - name: expires_in
        type: Duration
  - name: mandate.credential.RegisterResourceServer
    input:
      - name: context
        type: mandate.core.VerifiedContext
      - name: audience
        type: mandate.core.Audience
      - name: profile
        type: mandate.core.CredentialProfile
      - name: allowed_exchange_sources
        type: List<mandate.core.ResourceServerId>
      - name: client_id
        type: Optional<mandate.core.OAuthClientId>
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.ResourceServerRegistered
        payload:
          mandate.credential.ResourceServerRegistered:
            context: input.context
            id:
              response: resource_server_id
            audience: input.audience
            credential_profile: input.profile
            allowed_exchange_sources: input.allowed_exchange_sources
            client_id: input.client_id
        creates: mandate.credential.ResourceServer
        instance: id
        summary: A registration naming a client is that client's resource server (fork F11), and an identity-token exchange admits to it exactly the clients that client lists as trusted peers (fork F20). The client is named once, here, and never changed.
      - name: denied
        external: Caller lacks resource-server administration authority, audience registration is ambiguous, profile semantics are unadmitted, an allowed source server is unresolved/disabled/outside the verified organization, or the named client is unresolved/disabled/outside the verified organization.
        error: mandate.credential.Denied
    response:
      - name: resource_server_id
        type: mandate.core.ResourceServerId
  - name: mandate.credential.IssueReferenceCredential
    input:
      - name: context
        type: mandate.core.VerifiedContext
      - name: target
        type: mandate.core.ResourceServerId
      - name: requested_scope
        type: mandate.core.AuthorityScope
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.CredentialReferenceIssued
        payload:
          mandate.credential.CredentialReferenceIssued:
            context: input.context
            credential_id:
              response: credential_id
            descriptor:
              response: descriptor
            reference_verifier:
              generated: true
            epochs:
              response: epochs
            issued_at:
              generated: true
            target: input.target
            requested_scope: input.requested_scope
        creates: mandate.credential.AccessCredential
        instance: credential_id
      - name: denied
        external: Validated context is expired/revoked/stale, subject/actor authority or ceilings do not cover requested scope, target/profile is unregistered/disabled/outside tenant, expiry cannot be bounded, or verifier-only persistence and required audit cannot commit.
        error: mandate.credential.Denied
    response:
      - name: credential
        type: mandate.core.CredentialSecret
      - name: credential_id
        type: mandate.core.CredentialId
      - name: epochs
        type: Optional<mandate.core.EpochSnapshotRef>
      - name: descriptor
        type: mandate.core.CredentialDescriptor
  - name: mandate.credential.IssueSelfContainedCredential
    input:
      - name: context
        type: mandate.core.VerifiedContext
      - name: target
        type: mandate.core.ResourceServerId
      - name: requested_scope
        type: mandate.core.AuthorityScope
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.CredentialSelfContainedIssued
        payload:
          mandate.credential.CredentialSelfContainedIssued:
            context: input.context
            credential_id:
              response: credential_id
            descriptor:
              response: descriptor
            reference_verifier:
              generated: true
            epochs:
              response: epochs
            issued_at:
              generated: true
            target: input.target
            requested_scope: input.requested_scope
        creates: mandate.credential.AccessCredential
        instance: credential_id
      - name: denied
        external: Validated context is expired/revoked/stale, subject/actor authority or ceilings do not cover requested scope, target/profile/signing algorithm or key is unadmitted, expiry cannot be bounded, or the promised revocation/audit guarantee cannot be met.
        error: mandate.credential.Denied
    response:
      - name: credential
        type: mandate.core.CredentialSecret
      - name: credential_id
        type: mandate.core.CredentialId
      - name: epochs
        type: Optional<mandate.core.EpochSnapshotRef>
      - name: descriptor
        type: mandate.core.CredentialDescriptor
  - name: mandate.credential.ExchangeCredential
    input:
      - name: subject_proof
        type: mandate.core.CredentialProof
      - name: actor_proof
        type: Optional<mandate.core.CredentialProof>
      - name: target
        type: mandate.core.ResourceServerId
      - name: requested_scope
        type: mandate.core.AuthorityScope
      - name: delegation_id
        type: Optional<mandate.core.DelegationId>
      # What subject_proof is (RFC 8693 section 3); absent is an access credential.
      - name: subject_token_type
        type: Optional<mandate.credential.SubjectTokenType>
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.TokenExchangeAllowed
        payload:
          mandate.credential.TokenExchangeAllowed:
            context:
              generated: true
            credential_id:
              response: credential_id
            descriptor:
              response: descriptor
            reference_verifier:
              generated: true
            epochs:
              response: epochs
            issued_at:
              generated: true
            target: input.target
            requested_scope: input.requested_scope
        creates: mandate.credential.AccessCredential
        instance: credential_id
        summary: An access-credential subject is admitted when its source registration is among the target's allowed_exchange_sources. An identity-token subject (subject_token_type IdToken) is an identity token this deployment signed, unexpired, under a key still admitted for verification; its source is the client it was issued to (its azp, else its one audience). It is admitted only to a target registered with a client, and only when that client lists the source client among its trusted_peers and the source client, the target's client and the target are of one organization (fork F20). Both forms are decided by this one admission and recorded by this one event; a trusted peer is never a second authority path, and a peer relation is never transitive.
      - name: denied
        external: Either independently validated proof is invalid/revoked/expired/stale; actor, tenant, registered target/source, scope, space, delegation or ceiling binding fails; two current capability ceilings share one agent and organization-or-platform key; transitive delegation is requested; approval is required; an identity-token subject's client is not a trusted peer of the target's client, the target names no client, or the two clients are of different organizations; or authority/expiry narrowing and durable audit fail.
        error: mandate.credential.Denied
    response:
      - name: credential
        type: mandate.core.CredentialSecret
      - name: credential_id
        type: mandate.core.CredentialId
      - name: epochs
        type: Optional<mandate.core.EpochSnapshotRef>
      - name: descriptor
        type: mandate.core.CredentialDescriptor
  - name: mandate.credential.IntrospectCredential
    input:
      - name: caller_proof
        type: mandate.core.CredentialProof
      - name: credential_proof
        type: mandate.core.CredentialProof
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.CredentialIntrospected
        payload:
          mandate.credential.CredentialIntrospected:
            context:
              generated: true
            descriptor:
              response: descriptor
            active:
              response: active
            credential_id:
              response: credential_id
        summary: An active answer carries the descriptor and the credential_id of the record this log holds. An inactive answer carries neither — that is the answer for a credential this deployment revoked, one whose expiry has passed, and a well-formed proof that resolves to no record at all, which are one answer here and not three. The three are distinguished by nothing this event carries, deliberately, because a caller holding a well-formed proof learns only whether it is usable. This outcome creates, moves and updates nothing, and CredentialIntrospected folds into no record — its credential_id names an instance only when one exists in this log, and a fold reading it must not take the name for the existence of a record some other event created. The presented credential may have been issued by a deployment this log never saw, which is why the field is optional rather than the event's subject.
      - name: denied
        external: Caller proof lacks introspection authority for the registered server/tenant or is itself invalid, revoked or expired, the presented credential proof is malformed, principal/connection/epoch validation fails, audience mismatches, or authoritative online resolution is unavailable.
        error: mandate.credential.Denied
    response:
      - name: active
        type: Boolean
      - name: descriptor
        type: Optional<mandate.core.CredentialDescriptor>
      - name: credential_id
        type: Optional<mandate.core.CredentialId>
  - name: mandate.credential.IssueAuthorizationCode
    input:
      - name: context
        type: mandate.core.VerifiedContext
      - name: client_id
        type: mandate.core.OAuthClientId
      - name: session_id
        type: mandate.core.SessionId
      - name: target
        type: mandate.core.ResourceServerId
      - name: requested_scope
        type: mandate.core.AuthorityScope
      - name: challenge
        type: mandate.core.PkceChallenge
      - name: method
        type: mandate.core.PkceMethod
      - name: redirect_uri
        type: mandate.core.RedirectUri
      - name: expires_at
        type: Timestamp
      - name: identity_scopes
        type: Optional<List<mandate.credential.IdentityScope>>
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.AuthorizationCodeIssued
        payload:
          mandate.credential.AuthorizationCodeIssued:
            context: input.context
            code_id:
              response: code_id
            client_id: input.client_id
            session_id: input.session_id
            verifier:
              generated: true
            challenge: input.challenge
            method: input.method
            redirect_uri: input.redirect_uri
            expires_at: input.expires_at
            target: input.target
            scope:
              generated: true
            identity_scopes: input.identity_scopes
        creates: mandate.credential.AuthorizationCode
        instance: code_id
        summary: STS stores only a non-reversible verifier bound to the validated client, session, exact redirect, S256 challenge, registered target, narrowed scope, bounded expiry and the OpenID Connect scopes the authorization granted. The authorization request's nonce is held in memory beside the code for the code's lifetime and is no field of the record or the event (RedeemAuthorizationCode). Only the transient code is returned to the public-client adapter.
      - name: denied
        external: Trusted control-plane caller/session context, registered public client, exact redirect URI, S256 policy, tenant/target agreement, authority narrowing or bounded expiry validation fails, or the client the code would be bound to is disabled.
        error: mandate.credential.Denied
    response:
      - name: code_id
        type: mandate.core.AuthorizationCodeId
      - name: code
        type: mandate.core.CredentialSecret
  - name: mandate.credential.RegisterSigningKey
    input:
      - name: context
        type: mandate.core.VerifiedContext
      - name: key_reference
        type: mandate.core.KeyReference
      - name: algorithm
        type: mandate.core.SigningAlgorithm
      - name: window
        type: mandate.core.SigningKeyWindow
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.SigningKeyRegistered
        payload:
          mandate.credential.SigningKeyRegistered:
            context: input.context
            id:
              response: id
            key_reference: input.key_reference
            thumbprint:
              response: thumbprint
            algorithm: input.algorithm
            window: input.window
        creates: mandate.credential.SigningKey
        instance: id
        sets:
          window: input.window
        summary: The key enters the contract Recorded, which is what rotation requires — RetireSigningKey denies a retirement with no overlapping replacement published for continued verification, and no replacement can exist until a key can be registered. SigningKeyRegistered carries the whole mandate.credential.SigningKey record — the key identity, the reference the deployment resolves to the material, the thumbprint of the public key, the algorithm name and the validity window — so the credential fold materializes the key from this event alone and reads no command input or response. The mandate.core.SigningKeyId is the kid the signer publishes and a credential names; the thumbprint is the RFC 7638 JWK thumbprint of the public key this outcome resolved from key_reference, so a revocation record naming a kid and a thumbprint is rebuilt from this log without resolving the material of a key that was revoked as compromised. Both are decided by this outcome and read from its response. No key material enters the contract — KeyReference is a handle to material the deployment holds, and no event here carries a secret. The algorithm is a name and not an admitted algorithm (UNMAPPED-ALGORITHM-POLICY); the deployment's verifier-side allowlist admits it or the registration is denied. A key reference, or the key material it resolves to, already held by a recorded key is refused in every state that key can be in, including Retired and Revoked, so material the deployment revoked never returns under a second identity. The window ordering is the entity's invariant, window.not_before < window.expires_at, checked by the deciding handler; the two instants are one mandate.core.SigningKeyWindow because an invariant compares two fields only as members of one struct, and the accepted outcome sets the window from the command's input, so the invariant reads a specified value. No command replaces a key in place; rotation registers the successor and retires the predecessor.
      - name: denied
        external: Caller lacks platform signing-key administration authority, the algorithm is outside the deployment's admitted set, the key reference is unresolvable, or the key reference or the key material is already recorded.
        error: mandate.credential.Denied
    response:
      - name: id
        type: mandate.core.SigningKeyId
      - name: thumbprint
        type: String
  - name: mandate.credential.RetireSigningKey
    input:
      - name: id
        type: mandate.core.SigningKeyId
      - name: context
        type: mandate.core.VerifiedContext
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.SigningKeyRetired
        payload:
          mandate.credential.SigningKeyRetired:
            context: input.context
            id: input.id
        moves: mandate.credential.SigningKey.retire
        instance: id
        summary: Rotation, not revocation. A retired key signs nothing further; it remains admitted for verifying credentials already issued under it until they expire, which is the overlapping rotation period the key requirements demand.
      - name: wrong-state
        wrong_state: true
        error: mandate.credential.Denied
      - name: denied
        external: Caller lacks platform signing-key administration authority, the key is unresolved, no overlapping replacement key is published for continued verification, or retirement cannot durably stop further issuance under the key.
        error: mandate.credential.Denied
  - name: mandate.credential.RevokeSigningKey
    input:
      - name: id
        type: mandate.core.SigningKeyId
      - name: context
        type: mandate.core.VerifiedContext
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.SigningKeyRevoked
        payload:
          mandate.credential.SigningKeyRevoked:
            context: input.context
            id: input.id
        moves: mandate.credential.SigningKey.revoke
        instance: id
        summary: The emergency procedure. A revoked key is admitted for neither issuance nor verification, and the self-contained credentials it signed are refused from that point; the key record itself is kept.
      - name: wrong-state
        wrong_state: true
        error: mandate.credential.Denied
      - name: denied
        external: Caller lacks platform signing-key administration authority, the key is unresolved, or emergency revocation cannot durably stop both issuance and verification under the key and refuse the credentials it signed.
        error: mandate.credential.Denied
