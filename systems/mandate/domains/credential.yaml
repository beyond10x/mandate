# UNMAPPED-DENIAL-AUDIT: ESS error outcomes cannot emit audit events; trusted adapter must durably record denial outside the rejected domain transaction. See decision-blocker:guards.
# UNMAPPED-ALGORITHM-POLICY: SigningAlgorithm is a name, not an admitted algorithm. A verifier-side allowlist is required before issuance/validation.
# Exchange source IDs must resolve to enabled ResourceServer records in the same verified organization; audience text equality cannot admit a source.
# STS alone owns authorization-code verifier storage and consumption. RedeemAuthorizationCode.code_id is resolved by the trusted adapter from proof; it is not a public OAuth parameter or authority selector.
# UNMAPPED-ATOMICITY: verifier check, one-use consumption, credential creation and durable audit outbox commit as one STS transaction. Replay emits no credential.
# The control-plane public-client adapter invokes IssueAuthorizationCode only after authentication, consent/policy and exact client/redirect/S256 checks; this required service call is not an invented asynchronous event binding.
# A signing key is retired for rotation and revoked in an emergency; neither destroys the record, and no command deletes a key (decision-blocker:lifecycle).
domain: mandate.credential
entities:
  - name: mandate.credential.ResourceServer
    identity:
      name: id
      type: mandate.core.ResourceServerId
    fields:
      - name: organization_id
        type: mandate.core.OrganizationId
      - name: audience
        type: mandate.core.Audience
      - name: credential_profile
        type: mandate.core.CredentialProfile
      - name: allowed_exchange_sources
        type: List<mandate.core.ResourceServerId>
    lifecycle:
      initial: Enabled
      states:
        - Enabled
        - Disabled
      terminal:
        - Disabled
      transitions:
        - name: disable
          from:
            - Enabled
          to: Disabled
    relations:
      - name: organization_id_record
        kind: references
        target: mandate.tenancy.Organization
        cardinality: one
        via: organization_id
      - name: allowed_exchange_source_records
        kind: references
        target: mandate.credential.ResourceServer
        cardinality: many
        via: allowed_exchange_sources
  - name: mandate.credential.AccessCredential
    identity:
      name: id
      type: mandate.core.CredentialId
    fields:
      - name: descriptor
        type: mandate.core.CredentialDescriptor
      - name: reference_verifier
        type: Optional<mandate.core.CredentialVerifier>
      - name: epochs
        type: Optional<mandate.core.EpochSnapshotRef>
      - name: issued_at
        type: Timestamp
    lifecycle:
      initial: Active
      states:
        - Active
        - Revoked
      terminal:
        - Revoked
      transitions:
        - name: revoke
          from:
            - Active
          to: Revoked
    relations:
      - name: epoch_snapshot_record
        kind: references
        target: mandate.identity.SecurityEpochSnapshot
        cardinality: one
        via: epochs
  - name: mandate.credential.SigningKey
    identity:
      name: id
      type: mandate.core.SigningKeyId
    fields:
      - name: key_reference
        type: mandate.core.KeyReference
      - name: algorithm
        type: mandate.core.SigningAlgorithm
      - name: not_before
        type: Timestamp
      - name: expires_at
        type: Timestamp
    lifecycle:
      initial: Recorded
      states:
        - Recorded
        - Retired
        - Revoked
      terminal:
        - Retired
        - Revoked
      transitions:
        - name: retire
          from:
            - Recorded
          to: Retired
        - name: revoke
          from:
            - Recorded
            - Retired
          to: Revoked
  - name: mandate.credential.AuthorizationCode
    identity:
      name: id
      type: mandate.core.AuthorizationCodeId
    fields:
      - name: client_id
        type: mandate.core.OAuthClientId
      - name: session_id
        type: mandate.core.SessionId
      - name: verifier
        type: mandate.core.CredentialVerifier
      - name: challenge
        type: mandate.core.PkceChallenge
      - name: method
        type: mandate.core.PkceMethod
      - name: redirect_uri
        type: mandate.core.RedirectUri
      - name: expires_at
        type: Timestamp
      - name: target
        type: mandate.core.ResourceServerId
      - name: scope
        type: mandate.core.AuthorityScope
    lifecycle:
      initial: Issued
      states:
        - Issued
        - Consumed
      terminal:
        - Consumed
      transitions:
        - name: consume
          from:
            - Issued
          to: Consumed
    relations:
      - name: client_id_record
        kind: references
        target: mandate.federation.OAuthClient
        cardinality: one
        via: client_id
      - name: session_id_record
        kind: references
        target: mandate.identity.Session
        cardinality: one
        via: session_id
      - name: target_record
        kind: references
        target: mandate.credential.ResourceServer
        cardinality: one
        via: target
commands:
  - name: mandate.credential.DisableResourceServer
    input:
      - name: id
        type: mandate.core.ResourceServerId
      - name: context
        type: mandate.core.VerifiedContext
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.ResourceServerDisabled
        payload:
          mandate.credential.ResourceServerDisabled:
            context: input.context
        moves: mandate.credential.ResourceServer.disable
        instance: id
      - name: denied
        external: Caller lacks resource-server administration authority, server is outside the verified organization, or durable disablement cannot prevent subsequent issuance.
        error: mandate.credential.Denied
  - name: mandate.credential.RevokeAccessCredential
    input:
      - name: id
        type: mandate.core.CredentialId
      - name: context
        type: mandate.core.VerifiedContext
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.AccessCredentialRevoked
        payload:
          mandate.credential.AccessCredentialRevoked:
            context: input.context
        moves: mandate.credential.AccessCredential.revoke
        instance: id
      - name: denied
        external: Caller lacks credential-revocation authority, resolved credential is outside the verified organization, or the named profile revocation guarantee cannot be met.
        error: mandate.credential.Denied
  - name: mandate.credential.RedeemAuthorizationCode
    input:
      - name: code_id
        type: mandate.core.AuthorizationCodeId
      - name: client_id
        type: mandate.core.OAuthClientId
      - name: code
        type: mandate.core.CredentialProof
      - name: pkce_verifier
        type: mandate.core.CredentialProof
      - name: redirect_uri
        type: mandate.core.RedirectUri
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.AuthorizationCodeRedeemed
        payload:
          mandate.credential.AuthorizationCodeRedeemed:
            context:
              generated: true
            descriptor:
              response: descriptor
        moves: mandate.credential.AuthorizationCode.consume
        instance: code_id
        summary: STS atomically consumes the code and persists the narrowed credential and audit outbox. The returned credential remains bound to the code target, scope, session and expiry; a failed or replayed transaction produces no credential.
      - name: denied
        external: Code proof does not match the server-resolved code_id; code is consumed/expired; client, redirect URI or S256 verifier mismatches; the bound client is disabled; source/session epoch is stale; registered target is disabled or outside the verified tenant; or narrowing/atomic issuance validation fails.
        error: mandate.credential.Denied
    response:
      - name: credential
        type: mandate.core.CredentialSecret
      - name: descriptor
        type: mandate.core.CredentialDescriptor
  - name: mandate.credential.RegisterResourceServer
    input:
      - name: context
        type: mandate.core.VerifiedContext
      - name: audience
        type: mandate.core.Audience
      - name: profile
        type: mandate.core.CredentialProfile
      - name: allowed_exchange_sources
        type: List<mandate.core.ResourceServerId>
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.ResourceServerRegistered
        payload:
          mandate.credential.ResourceServerRegistered:
            context: input.context
      - name: denied
        external: Caller lacks resource-server administration authority, audience registration is ambiguous, profile semantics are unadmitted, or an allowed source server is unresolved/disabled/outside the verified organization.
        error: mandate.credential.Denied
    response:
      - name: resource_server_id
        type: mandate.core.ResourceServerId
  - name: mandate.credential.IssueReferenceCredential
    input:
      - name: context
        type: mandate.core.VerifiedContext
      - name: target
        type: mandate.core.ResourceServerId
      - name: requested_scope
        type: mandate.core.AuthorityScope
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.CredentialReferenceIssued
        payload:
          mandate.credential.CredentialReferenceIssued:
            context: input.context
            descriptor:
              response: descriptor
            target: input.target
            requested_scope: input.requested_scope
      - name: denied
        external: Validated context is expired/revoked/stale, subject/actor authority or ceilings do not cover requested scope, target/profile is unregistered/disabled/outside tenant, expiry cannot be bounded, or verifier-only persistence and required audit cannot commit.
        error: mandate.credential.Denied
    response:
      - name: credential
        type: mandate.core.CredentialSecret
      - name: descriptor
        type: mandate.core.CredentialDescriptor
  - name: mandate.credential.IssueSelfContainedCredential
    input:
      - name: context
        type: mandate.core.VerifiedContext
      - name: target
        type: mandate.core.ResourceServerId
      - name: requested_scope
        type: mandate.core.AuthorityScope
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.CredentialSelfContainedIssued
        payload:
          mandate.credential.CredentialSelfContainedIssued:
            context: input.context
            descriptor:
              response: descriptor
            target: input.target
            requested_scope: input.requested_scope
      - name: denied
        external: Validated context is expired/revoked/stale, subject/actor authority or ceilings do not cover requested scope, target/profile/signing algorithm or key is unadmitted, expiry cannot be bounded, or the promised revocation/audit guarantee cannot be met.
        error: mandate.credential.Denied
    response:
      - name: credential
        type: mandate.core.CredentialSecret
      - name: descriptor
        type: mandate.core.CredentialDescriptor
  - name: mandate.credential.ExchangeCredential
    input:
      - name: subject_proof
        type: mandate.core.CredentialProof
      - name: actor_proof
        type: Optional<mandate.core.CredentialProof>
      - name: target
        type: mandate.core.ResourceServerId
      - name: requested_scope
        type: mandate.core.AuthorityScope
      - name: delegation_id
        type: Optional<mandate.core.DelegationId>
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.TokenExchangeAllowed
        payload:
          mandate.credential.TokenExchangeAllowed:
            context:
              generated: true
            descriptor:
              response: descriptor
            target: input.target
            requested_scope: input.requested_scope
      - name: denied
        external: Either independently validated proof is invalid/revoked/expired/stale; actor, tenant, registered target/source, scope, space, delegation or ceiling binding fails; transitive delegation is requested; approval is required; or authority/expiry narrowing and durable audit fail.
        error: mandate.credential.Denied
    response:
      - name: credential
        type: mandate.core.CredentialSecret
      - name: descriptor
        type: mandate.core.CredentialDescriptor
  - name: mandate.credential.IntrospectCredential
    input:
      - name: caller_proof
        type: mandate.core.CredentialProof
      - name: credential_proof
        type: mandate.core.CredentialProof
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.CredentialIntrospected
        payload:
          mandate.credential.CredentialIntrospected:
            context:
              generated: true
            descriptor:
              response: descriptor
      - name: denied
        external: Caller proof lacks introspection authority for the registered server/tenant, presented verifier is invalid/revoked/expired, principal/connection/epoch validation fails, audience mismatches, or authoritative online resolution is unavailable.
        error: mandate.credential.Denied
    response:
      - name: active
        type: Boolean
      - name: descriptor
        type: Optional<mandate.core.CredentialDescriptor>
  - name: mandate.credential.IssueAuthorizationCode
    input:
      - name: context
        type: mandate.core.VerifiedContext
      - name: client_id
        type: mandate.core.OAuthClientId
      - name: session_id
        type: mandate.core.SessionId
      - name: target
        type: mandate.core.ResourceServerId
      - name: requested_scope
        type: mandate.core.AuthorityScope
      - name: challenge
        type: mandate.core.PkceChallenge
      - name: method
        type: mandate.core.PkceMethod
      - name: redirect_uri
        type: mandate.core.RedirectUri
      - name: expires_at
        type: Timestamp
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.AuthorizationCodeIssued
        payload:
          mandate.credential.AuthorizationCodeIssued:
            context: input.context
            code_id:
              response: code_id
            target: input.target
        summary: STS stores only a non-reversible verifier bound to the validated client, session, exact redirect, S256 challenge, registered target, narrowed scope and bounded expiry. Only the transient code is returned to the public-client adapter.
      - name: denied
        external: Trusted control-plane caller/session context, registered public client, exact redirect URI, S256 policy, tenant/target agreement, authority narrowing or bounded expiry validation fails, or the client the code would be bound to is disabled.
        error: mandate.credential.Denied
    response:
      - name: code_id
        type: mandate.core.AuthorizationCodeId
      - name: code
        type: mandate.core.CredentialSecret
  - name: mandate.credential.RetireSigningKey
    input:
      - name: id
        type: mandate.core.SigningKeyId
      - name: context
        type: mandate.core.VerifiedContext
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.SigningKeyRetired
        payload:
          mandate.credential.SigningKeyRetired:
            context: input.context
            id: input.id
        moves: mandate.credential.SigningKey.retire
        instance: id
        summary: Rotation, not revocation. A retired key signs nothing further; it remains admitted for verifying credentials already issued under it until they expire, which is the overlapping rotation period the key requirements demand.
      - name: denied
        external: Caller lacks signing-key administration authority, the key is unresolved, no overlapping replacement key is published for continued verification, or retirement cannot durably stop further issuance under the key.
        error: mandate.credential.Denied
  - name: mandate.credential.RevokeSigningKey
    input:
      - name: id
        type: mandate.core.SigningKeyId
      - name: context
        type: mandate.core.VerifiedContext
    outcomes:
      - name: accepted
        emits:
          - mandate.credential.SigningKeyRevoked
        payload:
          mandate.credential.SigningKeyRevoked:
            context: input.context
            id: input.id
        moves: mandate.credential.SigningKey.revoke
        instance: id
        summary: The emergency procedure. A revoked key is admitted for neither issuance nor verification, and the self-contained credentials it signed are refused from that point; the key record itself is kept.
      - name: denied
        external: Caller lacks signing-key administration authority, the key is unresolved, or emergency revocation cannot durably stop both issuance and verification under the key and refuse the credentials it signed.
        error: mandate.credential.Denied
events:
  - name: mandate.credential.ResourceServerDisabled
    fields:
      - name: context
        type: mandate.core.VerifiedContext
  - name: mandate.credential.AccessCredentialRevoked
    fields:
      - name: context
        type: mandate.core.VerifiedContext
  - name: mandate.credential.AuthorizationCodeRedeemed
    fields:
      - name: context
        type: mandate.core.VerifiedContext
      - name: descriptor
        type: mandate.core.CredentialDescriptor
  - name: mandate.credential.ResourceServerRegistered
    fields:
      - name: context
        type: mandate.core.VerifiedContext
  - name: mandate.credential.CredentialReferenceIssued
    fields:
      - name: context
        type: mandate.core.VerifiedContext
      - name: descriptor
        type: mandate.core.CredentialDescriptor
      - name: target
        type: mandate.core.ResourceServerId
      - name: requested_scope
        type: mandate.core.AuthorityScope
  - name: mandate.credential.CredentialSelfContainedIssued
    fields:
      - name: context
        type: mandate.core.VerifiedContext
      - name: descriptor
        type: mandate.core.CredentialDescriptor
      - name: target
        type: mandate.core.ResourceServerId
      - name: requested_scope
        type: mandate.core.AuthorityScope
  - name: mandate.credential.TokenExchangeAllowed
    fields:
      - name: context
        type: mandate.core.VerifiedContext
      - name: descriptor
        type: mandate.core.CredentialDescriptor
      - name: target
        type: mandate.core.ResourceServerId
      - name: requested_scope
        type: mandate.core.AuthorityScope
  - name: mandate.credential.CredentialIntrospected
    fields:
      - name: context
        type: mandate.core.VerifiedContext
      - name: descriptor
        type: Optional<mandate.core.CredentialDescriptor>
  - name: mandate.credential.TokenExchangeDenied
    fields:
      - name: context
        type: Optional<mandate.core.VerifiedContext>
      - name: requested_target
        type: mandate.core.ResourceServerId
      - name: requested_scope
        type: mandate.core.AuthorityScope
  - name: mandate.credential.AuthorizationCodeIssued
    fields:
      - name: context
        type: mandate.core.VerifiedContext
      - name: code_id
        type: mandate.core.AuthorizationCodeId
      - name: target
        type: mandate.core.ResourceServerId
  - name: mandate.credential.SigningKeyRetired
    fields:
      - name: context
        type: mandate.core.VerifiedContext
      - name: id
        type: mandate.core.SigningKeyId
  - name: mandate.credential.SigningKeyRevoked
    fields:
      - name: context
        type: mandate.core.VerifiedContext
      - name: id
        type: mandate.core.SigningKeyId
errors:
  - name: mandate.credential.Denied
    summary: Fail closed; no credential, authority or lifecycle mutation on refusal.
    fields:
      - name: reason
        type: mandate.core.DenialReason
