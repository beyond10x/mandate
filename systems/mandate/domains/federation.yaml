      - name: client_id
        type: mandate.core.ClientId
      - name: tenant_resolution
        type: mandate.core.TenantResolutionRule
      - name: jit_provisioning
        type: Boolean
  - name: mandate.federation.FederationAuthenticated
    fields:
      - name: session_id
        type: mandate.core.SessionId
      - name: principal_id
        type: mandate.core.PrincipalId
      - name: audience
        type: mandate.core.Audience
      - name: correlation
