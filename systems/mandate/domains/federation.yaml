# The canonical external key is (organization, connection.issuer, external subject); issuer is derived from the validated connection, not duplicated or caller-selected.
# UNMAPPED-UNIQUENESS: storage must enforce the composite external key and organization/connection consistency atomically. A connection issuer is immutable; changing issuer requires a new connection and explicit relinking. See decision-blocker:identity-uniqueness.
# AuthorizeClient orchestrates verified session/client checks and the STS IssueAuthorizationCode port; STS owns the code record and one-use redemption transaction.
# jit_provisioning gates ProvisionExternalPrincipal alone: a connection that does not admit provisioning denies the first login and creates nothing. The link that command creates carries ExternalLinkMethod::ConfiguredFederation; see decision-blocker:jit-provisioning.
domain: mandate.federation
entities:
  - name: mandate.federation.ExternalPrincipal
    identity:
      name: id
      type: mandate.core.ExternalPrincipalId
    fields:
      - name: organization_id
        type: mandate.core.OrganizationId
      - name: subject
        type: mandate.core.ExternalSubject
      - name: principal_id
        type: mandate.core.PrincipalId
      - name: connection_id
        type: mandate.core.FederationConnectionId
      - name: link_method
        type: mandate.core.ExternalLinkMethod
      - name: linked_at
        type: Timestamp
    lifecycle:
      initial: Linked
      states:
        - Linked
        - Unlinked
      terminal:
        - Unlinked
      transitions:
        - name: unlink
          from:
            - Linked
          to: Unlinked
    relations:
      - name: organization_id_record
        kind: references
        target: mandate.tenancy.Organization
        cardinality: one
        via: organization_id
      - name: principal_id_record
        kind: references
        target: mandate.identity.Principal
        cardinality: one
        via: principal_id
      - name: connection_id_record
        kind: references
        target: mandate.federation.FederationConnection
        cardinality: one
        via: connection_id
  - name: mandate.federation.FederationConnection
    identity:
      name: id
      type: mandate.core.FederationConnectionId
    fields:
      - name: organization_id
        type: mandate.core.OrganizationId
      - name: issuer
        type: mandate.core.Issuer
      - name: client_id
        type: mandate.core.ClientId
      - name: tenant_resolution
        type: mandate.core.TenantResolutionRule
      - name: jit_provisioning
        type: Boolean
      - name: groups
        type: Optional<mandate.core.GroupFilter>
    lifecycle:
      initial: Enabled
      states:
        - Enabled
        - Disabled
      terminal:
        - Disabled
      transitions:
        - name: disable
          from:
            - Enabled
          to: Disabled
    relations:
      - name: organization_id_record
        kind: references
        target: mandate.tenancy.Organization
        cardinality: one
        via: organization_id
  - name: mandate.federation.OAuthClient
    identity:
      name: id
      type: mandate.core.OAuthClientId
    fields:
      - name: organization_id
        type: mandate.core.OrganizationId
      - name: client_type
        type: mandate.core.OAuthClientType
      - name: secret_verifiers
        type: List<mandate.core.CredentialVerifier>
      - name: redirect_uris
        type: List<mandate.core.RedirectUri>
      - name: pkce_method
        type: mandate.core.PkceMethod
      - name: pkce_required
        type: Boolean
      - name: trusted_peers
        type: List<mandate.core.OAuthClientId>
      - name: post_logout_redirect_uris
        type: List<mandate.core.RedirectUri>
    lifecycle:
      initial: Recorded
      states:
        - Recorded
        - Disabled
      terminal:
        - Disabled
      transitions:
        - name: disable
          from:
            - Recorded
          to: Disabled
    relations:
      - name: organization_id_record
        kind: references
        target: mandate.tenancy.Organization
        cardinality: one
        via: organization_id
      - name: trusted_peers
        kind: references
        target: mandate.federation.OAuthClient
        cardinality: many
        via: trusted_peers
commands:
  - name: mandate.federation.UnlinkExternalPrincipal
    input:
      - name: id
        type: mandate.core.ExternalPrincipalId
      - name: context
        type: mandate.core.VerifiedContext
    outcomes:
      - name: accepted
        emits:
          - mandate.federation.ExternalPrincipalUnlinked
        payload:
          mandate.federation.ExternalPrincipalUnlinked:
            context: input.context
            id: input.id
        moves: mandate.federation.ExternalPrincipal.unlink
        instance: id
      - name: wrong-state
        wrong_state: true
        error: mandate.federation.Denied
      - name: denied
        external: Caller lacks explicit link-administration authority, link is outside the verified organization, or unlinking and its required invalidation/audit cannot commit.
        error: mandate.federation.Denied
  - name: mandate.federation.DisableFederationConnection
    input:
      - name: id
        type: mandate.core.FederationConnectionId
      - name: context
        type: mandate.core.VerifiedContext
    outcomes:
      - name: accepted
        emits:
          - mandate.federation.FederationConnectionDisabled
        payload:
          mandate.federation.FederationConnectionDisabled:
            context: input.context
            id: input.id
        moves: mandate.federation.FederationConnection.disable
        instance: id
      - name: wrong-state
        wrong_state: true
        error: mandate.federation.Denied
      - name: denied
        external: Caller lacks federation-administration authority, connection is outside the verified organization, or emergency trust shutdown and affected generation invalidation cannot commit.
        error: mandate.federation.Denied
  - name: mandate.federation.LinkExternalPrincipal
    input:
      - name: context
        type: mandate.core.VerifiedContext
      - name: connection_id
        type: mandate.core.FederationConnectionId
      - name: external_subject
        type: mandate.core.ExternalSubject
      - name: principal_id
        type: mandate.core.PrincipalId
      - name: method
        type: mandate.core.ExternalLinkMethod
    outcomes:
      - name: accepted
        emits:
          - mandate.federation.ExternalPrincipalLinked
        payload:
          mandate.federation.ExternalPrincipalLinked:
            context: input.context
            connection_id: input.connection_id
            principal_id: input.principal_id
            external_principal_id:
              response: external_principal_id
            subject: input.external_subject
            link_method: input.method
            linked_at:
              generated: true
        creates: mandate.federation.ExternalPrincipal
        instance: external_principal_id
      - name: denied
        external: Caller/method lacks linking authority, proof/connection trust is invalid, organization or target principal mismatches, composite (organization, configured issuer, subject) key conflicts, or durable audited linking fails. Email equality never authorizes linking.
        error: mandate.federation.Denied
    response:
      - name: external_principal_id
        type: mandate.core.ExternalPrincipalId
  - name: mandate.federation.RegisterFederationConnection
    input:
      - name: context
        type: mandate.core.VerifiedContext
      - name: issuer
        type: mandate.core.Issuer
      - name: client_id
        type: mandate.core.ClientId
      - name: tenant_resolution
        type: mandate.core.TenantResolutionRule
      - name: jit_provisioning
        type: Boolean
      - name: groups
        type: Optional<mandate.core.GroupFilter>
    outcomes:
      - name: accepted
        emits:
          - mandate.federation.FederationConnectionCreated
        payload:
          mandate.federation.FederationConnectionCreated:
            context: input.context
            connection_id:
              response: connection_id
            issuer: input.issuer
            client_id: input.client_id
            tenant_resolution: input.tenant_resolution
            jit_provisioning: input.jit_provisioning
            groups: input.groups
        creates: mandate.federation.FederationConnection
        instance: connection_id
        summary: The connection is created with its provisioning setting, its tenant rule and its group filter decided here and never changed afterwards. A tenant rule that names a validated claim lists every value that resolves (a hosted-domain list), and any one of them resolves. A connection without a group filter records no groups for any login. A connection whose issuer, provisioning admission, accepted claim values or group filter must change is disabled and registered again; there is no update command.
      - name: denied
        external: Caller lacks federation-administration authority, issuer/client/trust, tenant-resolution or just-in-time provisioning configuration is unadmitted, the tenant rule names a claim with an empty value list or values without a claim name, the group filter's cap is below one, or organization binding is invalid.
        error: mandate.federation.Denied
    response:
      - name: connection_id
        type: mandate.core.FederationConnectionId
  - name: mandate.federation.AuthenticateFederation
    input:
      - name: connection_id
        type: mandate.core.FederationConnectionId
      - name: proof
        type: mandate.core.CredentialProof
    outcomes:
      - name: accepted
        emits:
          - mandate.federation.FederationAuthenticated
          - mandate.federation.ExternalProfileObserved
        payload:
          mandate.federation.FederationAuthenticated:
            session_id:
              response: session_id
            principal_id:
              response: principal_id
            audience:
              generated: true
            correlation:
              generated: true
            connection_id: input.connection_id
            organization_id:
              response: organization_id
            epochs:
              response: epochs
            expires_at:
              response: expires_at
          mandate.federation.ExternalProfileObserved:
            organization_id:
              response: organization_id
            correlation:
              generated: true
            connection_id: input.connection_id
            external_principal_id:
              generated: true
            email:
              generated: true
            email_verified:
              generated: true
            name:
              generated: true
            groups:
              generated: true
            observed_at:
              generated: true
        creates: mandate.identity.Session
        instance: session_id
        summary: "A validated federated login mints the session, which is step 9 of the resolution order in docs/architecture/federated-login.md. FederationAuthenticated carries the whole mandate.identity.Session record — the new session identity, the principal, the resolved organization, the connection, the epoch snapshot the session is bound to and its expiry — so the identity fold materializes the session from this event alone and reads no command input or response. The audience and the correlation are carried beside the record. The principal, the organization, the epoch snapshot handle and the expiry are the ones this command resolved and returned, so the fold reads each from the response rather than from a value the implementation invented; the snapshot's own contents are recorded by the adapter through EpochSnapshotRecorded. ExternalProfileObserved records the profile of this login for later issuance (fork F13): the external principal the login resolved through its link, and the email, its verified flag, the name and the groups, each read from the validated proof and never from a caller input. An email the upstream does not mark verified is recorded with email_verified false, never true. The groups are those the connection's group filter admits: a group outside the allowlist never appears in the event, and a connection without a filter records an empty list."
      - name: denied
        external: Connection is disabled/untrusted, proof signature/issuer/audience/expiry is invalid, tenant resolution has zero or multiple matches, principal linking is absent/conflicting, the groups the connection's filter admits number more than its cap, or any email-domain/unverified-input fallback would be required.
        error: mandate.federation.Denied
        summary: "A refused login opens no session and records no profile. In tenant resolution, a rule naming a claim matches only when the validated claim equals one of its listed values, and an absent claim matches none."
    response:
      - name: session_id
        type: mandate.core.SessionId
      - name: principal_id
        type: mandate.core.PrincipalId
      - name: organization_id
        type: mandate.core.OrganizationId
      - name: epochs
        type: mandate.core.EpochSnapshotRef
      - name: expires_at
        type: Timestamp
  - name: mandate.federation.ProvisionExternalPrincipal
    input:
      - name: connection_id
        type: mandate.core.FederationConnectionId
      - name: proof
        type: mandate.core.CredentialProof
    outcomes:
      - name: accepted
        emits:
          - mandate.federation.ExternalPrincipalProvisioned
        payload:
          mandate.federation.ExternalPrincipalProvisioned:
            organization_id:
              response: organization_id
            correlation:
              generated: true
            connection_id: input.connection_id
            principal_id:
              response: principal_id
            kind: User
            display_name:
              response: display_name
            external_principal_id:
              response: external_principal_id
            subject:
              response: subject
            link_method: ConfiguredFederation
            linked_at:
              generated: true
        creates: mandate.federation.ExternalPrincipal
        instance: external_principal_id
        summary: "Just-in-time provisioning on first login. The outcome creates exactly one record, the mandate.federation.ExternalPrincipal linking the principal with ExternalLinkMethod::ConfiguredFederation. The event also names the mandate.identity.Principal of kind User the provisioning produced, and no outcome in this contract declares that Principal's creation. Both identities, the external subject and the display name are bound from the response rather than left to the implementation; the display name is the validated subject until a connection admits a display-name claim, which no connection declares yet (story:federation-linking). The composite key is (organization, connection issuer, external subject), with the issuer read from the validated connection and the subject from the validated proof, never from the caller. No session is minted here; the adapter calls AuthenticateFederation again."
      - name: denied
        external: Connection is disabled/untrusted, proof signature/issuer/audience/expiry is invalid, tenant resolution has zero or multiple matches, principal linking is conflicting, connection does not admit provisioning, the composite (organization, configured issuer, subject) key already exists, or any email-domain/unverified-input fallback would be required.
        error: mandate.federation.Denied
    response:
      - name: external_principal_id
        type: mandate.core.ExternalPrincipalId
      - name: principal_id
        type: mandate.core.PrincipalId
      - name: organization_id
        type: mandate.core.OrganizationId
      - name: subject
        type: mandate.core.ExternalSubject
      - name: display_name
        type: String
  - name: mandate.federation.AuthorizeClient
    input:
      - name: client_id
        type: mandate.core.OAuthClientId
      - name: redirect_uri
        type: mandate.core.RedirectUri
      - name: challenge
        type: mandate.core.PkceChallenge
      - name: method
        type: mandate.core.PkceMethod
      - name: state
        type: String
      - name: nonce
        type: String
      - name: session_proof
        type: mandate.core.CredentialProof
      - name: target
        type: mandate.core.ResourceServerId
      - name: requested_scope
        type: mandate.core.AuthorityScope
    outcomes:
      - name: accepted
        emits:
          - mandate.federation.AuthorizationCodeIssued
        payload:
          mandate.federation.AuthorizationCodeIssued:
            organization_id:
              generated: true
            correlation:
              generated: true
            code_id:
              response: code_id
            client_id: input.client_id
            session_id:
              generated: true
            redirect_uri: input.redirect_uri
            challenge: input.challenge
            method: input.method
            target: input.target
            requested_scope: input.requested_scope
        summary: The control plane orchestrates the verified session and client checks and calls the STS IssueAuthorizationCode port; the STS creates the mandate.credential.AuthorizationCode record and returns its identity, which this event names. This outcome creates nothing — code_id is the code STS minted, not one minted here — and the transient code is returned to the public-client adapter and to nothing else.
      - name: denied
        external: Session proof is invalid/stale, client is not a registered public client, the client is disabled, exact redirect URI or state/applicable nonce binding fails, S256 challenge is absent/invalid, target is unregistered/outside tenant, or STS code issuance/narrowing is refused.
        error: mandate.federation.Denied
    response:
      - name: code_id
        type: mandate.core.AuthorizationCodeId
      - name: code
        type: mandate.core.CredentialSecret
  - name: mandate.federation.RegisterOAuthClient
    input:
      - name: context
        type: mandate.core.VerifiedContext
      - name: client_type
        type: mandate.core.OAuthClientType
      - name: secret_verifiers
        type: List<mandate.core.CredentialVerifier>
      - name: redirect_uris
        type: List<mandate.core.RedirectUri>
      - name: pkce_method
        type: mandate.core.PkceMethod
      - name: pkce_required
        type: Boolean
      - name: trusted_peers
        type: List<mandate.core.OAuthClientId>
      - name: post_logout_redirect_uris
        type: List<mandate.core.RedirectUri>
    outcomes:
      - name: accepted
        emits:
          - mandate.federation.OAuthClientRegistered
        payload:
          mandate.federation.OAuthClientRegistered:
            context: input.context
            id:
              response: id
            organization_id:
              response: organization_id
            client_type: input.client_type
            secret_verifiers: input.secret_verifiers
            redirect_uris: input.redirect_uris
            pkce_method: input.pkce_method
            pkce_required: input.pkce_required
            trusted_peers: input.trusted_peers
            post_logout_redirect_uris: input.post_logout_redirect_uris
        creates: mandate.federation.OAuthClient
        instance: id
        summary: The client is bound to the organization the verified context carries; the command takes no organization input, so no caller selects the tenant a client is registered into. A confidential client authenticates with a secret, and the registration carries only the keyed verifiers derived from its secret references (fork F2), one or two so that a secret can be rotated; the secret itself is never an input, an event field or a record field. A public client states no verifier and always requires PKCE (fork F3); a confidential client may require it. Each trusted peer names another client of the same organization that may obtain tokens for this one. OAuthClientRegistered carries the whole mandate.federation.OAuthClient record — the client identity, its organization, its client type, its verifiers, its exact redirect set, its PKCE method and requirement, its trusted peers and its exact post-logout redirect set — so the federation fold materializes the client from this event alone and reads no command input or response. The identity and the organization are the ones this outcome decided and returned, read from the response rather than from a value the implementation invented. An empty redirect set is admitted and is not a denial — the client it registers is inert, because AuthorizeClient matches the presented redirect against the registered set exactly and an empty set matches nothing, so every authorization request to that client is refused. mandate.core.PkceMethod admits S256 and nothing else, so no registration can name another method and none is refused for naming one. A registration whose redirect surface or PKCE method must change is disabled and registered again; there is no update command.
      - name: denied
        external: Caller lacks client-administration authority, a redirect URI or post-logout redirect URI is unadmitted, a public client states a secret verifier or does not require PKCE, a confidential client states no verifier or more than two, a trusted peer names the client itself or no client registered in the verified organization, or organization binding is invalid.
        error: mandate.federation.Denied
    response:
      - name: id
        type: mandate.core.OAuthClientId
      - name: organization_id
        type: mandate.core.OrganizationId
  - name: mandate.federation.DisableOAuthClient
    input:
      - name: id
        type: mandate.core.OAuthClientId
      - name: context
        type: mandate.core.VerifiedContext
    outcomes:
      - name: accepted
        emits:
          - mandate.federation.OAuthClientDisabled
        payload:
          mandate.federation.OAuthClientDisabled:
            context: input.context
            id: input.id
        moves: mandate.federation.OAuthClient.disable
        instance: id
        summary: A registered public client whose redirect surface is no longer trusted stops being admitted. The registration record is kept. No new authorization code is issued to it, and an outstanding code is refused at redemption, where RedeemAuthorizationCode re-reads the client the code is bound to; no declared move invalidates an outstanding code.
      - name: wrong-state
        wrong_state: true
        error: mandate.federation.Denied
      - name: denied
        external: Caller lacks client-administration authority, the client is outside the verified organization, or disablement cannot stop the issuance of new authorization codes to it.
        error: mandate.federation.Denied
